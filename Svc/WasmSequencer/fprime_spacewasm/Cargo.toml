[package]
name = "fprime_spacewasm"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "fprime_spacewasm"
crate-type = ["staticlib"]

[dependencies]
spacewasm_c_api = "0.4.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = false

[profile.dev]
panic = "abort"
strip = false
