# Semantic code analysis with CodeQL 
# see https://github.com/github/codeql-action

name: "Code Scan: JPL Coding Standard"

on:
  push:
    branches: [ devel, release/** ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ devel, release/** ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/agents/**'
# Cancel in-progress runs if a newer run is started on a given PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'devel') && !contains(github.ref, 'release/')}}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
        config-file: ['jpl-standard-pack-1.yml', 'jpl-standard-pack-2.yml', 'jpl-standard-pack-3.yml', 'jpl-standard-known-autocode-issues.yml']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Generate the CMake build cache BEFORE initializing CodeQL so that CMake's
    # own compiler-identification and feature-detection compilations (e.g.
    # build-*/**/CMakeFiles/**/CompilerIdCXX/CMakeCXXCompilerId.cpp) run untraced
    # and never enter the CodeQL database, so they raise no alerts. For compiled
    # languages paths-ignore is only an advisory SARIF filter and does not
    # reliably suppress these, so we exclude them at the build-tracing layer.
    #
    # COVERAGE CAVEAT: any source compiled during `fprime-util generate` (the
    # CMake configure step) is NOT analyzed. Today only inherited/third-party
    # code (e.g. FetchContent _deps) is compiled here, which we do not want to
    # scan anyway. If first-party code is ever added to the configure step it
    # would silently escape analysis; if that happens, filter the SARIF instead
    # (e.g. advanced-security/filter-sarif) so the traced build stays complete.
    - name: Generate build cache (untraced)
      run: |
          python3 -m venv ./fprime-venv
          . ./fprime-venv/bin/activate
          pip install -U setuptools setuptools_scm wheel pip
          pip install -r ./requirements.txt
          fprime-util generate

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Run jobs in parallel for each config-file
        config-file: ./.github/actions/codeql/${{ matrix.config-file }}

    - name: Build
      run: |
          . ./fprime-venv/bin/activate
          fprime-util build --all

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        # Only publish alerts to the GitHub code-scanning UI for the default
        # branch (devel). The analysis still runs on other branches and PRs so
        # regressions are caught, but results are not uploaded, preventing stale
        # branches from accumulating alerts.
        upload: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/devel') && 'always' || 'never' }}
