# Build verification for the F´ Ref deployment.

name: "Ref Build"

on:
  push:
    branches: [ devel, release/** ]
  pull_request:
    branches: [ devel, release/** ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (e.g. ubuntu-22.04, macos-latest)"
        required: false
        default: "ubuntu-22.04"
      python-version:
        description: "Python version (only used on macOS runners)"
        required: false
        default: "3.12"
      jobs:
        description: "Parallel job count"
        required: false
        default: "8"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'devel') && !contains(github.ref, 'release/') }}

jobs:
  build:
    name: "Ref"
    runs-on: ${{ inputs.runner || 'ubuntu-22.04' }}
    steps:
      - name: "Checkout F´ Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: "Setup Python"
        if: contains(inputs.runner || '', 'macos')
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.12' }}
      - name: "Setup F´ Tools"
        uses: nasa/fprime-actions/setup@devel
      - name: "Build Ref"
        uses: ./.github/actions/build
        with:
          working-directory: "Ref"
          jobs: ${{ inputs.jobs || '8' }}
