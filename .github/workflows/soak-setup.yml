# Soak Test Setup (generalizable)
#
# Cross-compiles an external F´ deployment and installs it on a self-hosted
# runner as persistent flight-software + GDS systemd services using the
# reusable soak actions in nasa/fprime-actions.
#
# To adapt this to a different deployment, edit the `env` block below: point it
# at your repository, deployment name, runner labels, and (if needed) framing.
# Everything else is handled by the reusable actions.
#
# Pairs with soak-test.yml, which runs on a schedule against the services this
# workflow leaves running.
name: "Soak Setup (external deployment)"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      service-user:
        description: "Linux user to run the services as"
        required: false
        default: "fprime"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ---- Deployment-specific knobs (edit these for your deployment) ----------
  TARGET_REPOSITORY: moisesmata/fprime-workshop-led-blinker
  TARGET_REF: devel
  # Artifact-relative globs to the cross-compiled binary and dictionary.
  BINARY_GLOB: "artifacts/build-artifacts/aarch64-linux/*/bin/*"
  DICTIONARY_GLOB: "artifacts/build-artifacts/aarch64-linux/*/dict/*TopologyDictionary.json"
  # Integration tests to install (relative to the checked-out target repo).
  TEST_SOURCE: "LedBlinker/Components/Led/test/int"
  # CCSDS framing used by the deployment's GDS connection.
  GDS_FRAMING: "space-packet-space-data-link"
  INSTALL_DIR: /opt/fprime-soak
  SERVICE_PREFIX: fprime-soak

jobs:
  cross-compilation:
    name: "Cross Compilation (aarch64-linux)"
    runs-on: ubuntu-22.04
    steps:
      - name: "Setup external repository + overlay F´"
        uses: nasa/fprime-actions/external-repository-setup@devel
        with:
          target_repository: ${{ env.TARGET_REPOSITORY }}
          target_ref: ${{ env.TARGET_REF }}
          fprime_location: ./lib/fprime
      - name: "Cross compile with aarch64-linux toolchain"
        uses: nasa/fprime-actions/build-with-aarch64-toolchain@devel
      - name: "Assemble soak artifact"
        shell: bash
        run: |
          mkdir -p soak-artifact
          cp -r ./build-artifacts soak-artifact/
          # Ship the integration tests and a requirements.txt so the deploy job
          # (which only downloads this artifact) can build the venv and install tests.
          if [ -d "${TEST_SOURCE}" ]; then
            mkdir -p soak-artifact/int
            cp -r "${TEST_SOURCE}/." soak-artifact/int/
          fi
          cp ./lib/fprime/requirements.txt soak-artifact/requirements.txt
      - name: "Archive soak artifact"
        uses: actions/upload-artifact@v4
        with:
          name: soak-artifact
          path: soak-artifact
          retention-days: 5

  deploy:
    name: "Deploy persistent soak services"
    runs-on: [self-hosted, ARM64]
    needs: cross-compilation
    steps:
      - name: "Download soak artifact"
        uses: actions/download-artifact@v4
        with:
          name: soak-artifact
          path: artifacts
      - name: "Deploy FSW + persistent GDS services"
        uses: nasa/fprime-actions/soak-deploy@devel
        with:
          install-dir: ${{ env.INSTALL_DIR }}
          service-prefix: ${{ env.SERVICE_PREFIX }}
          service-user: ${{ github.event.inputs.service-user || 'fprime' }}
          binary: ${{ env.BINARY_GLOB }}
          dictionary: ${{ env.DICTIONARY_GLOB }}
          requirements: "artifacts/requirements.txt"
          extra-pip-packages: "psutil"
          test-source: "artifacts/int"
          gds-extra-args: "--framing-selection ${{ env.GDS_FRAMING }}"
