# This workflow is intended for reuse by other workflows and will not run directly (no triggers).
# The behavior is to build an external F´ project (e.g. fprime-community/system-reference) using
# the current F´ version.
name: "F´ Project Builder - Reusable Workflow"

on:
  workflow_call:
    inputs:
      build_location:
        description: "Path to F´ module to build. E.g. MyDeployment/"
        required: true
        type: string
      target_repository:
        description: "Additional external repository to checkout (<owner>/<repo>)"
        required: true
        type: string
      run_unit_tests:
        description: "Run an additional job in parallel to run unit tests."
        required: false
        type: boolean
        default: true
      fprime_location:
        description: "Relative path from the external project root to its F´ submodule"
        required: false
        type: string
        default: "./fprime"
      runs_on:
        description: "Platform to run on. Defaults to ubuntu-22.04"
        required: false
        type: string
        default: "ubuntu-22.04"
      target_platform:
        description: "Target platform to pass to fprime-util"
        required: false
        type: string
        default: ""
      target_ref:
        description: "Branch on target to checkout"
        required: false
        type: string
        default: "devel"
      skip_aarch64_build:
        description: "Skip ARM64 cross-compilation build"
        required: false
        type: boolean
        default: false

jobs:

  build:
    runs-on: ${{ inputs.runs_on }}
    name: "Build"
    env:
      FPRIME_LOCATION: ${{ inputs.fprime_location }}
      TARGET_PLATFORM: ${{ inputs.target_platform }}
    steps:
      - name: "Checkout target repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive 
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_ref }}
      - name: "Overlay current F´ revision"
        uses: actions/checkout@v4
        with:
          submodules: true
          path: ${{ inputs.fprime_location }}
      - name: "Install requirements.txt"
        run: |
          pip3 install -r ${FPRIME_LOCATION}/requirements.txt
        shell: bash
      - name: "Generate build cache"
        working-directory: ${{ inputs.build_location }}
        run: |
          if [ "${RUNNER_DEBUG:-0}" = "1" ]; then
            VERBOSE_FLAG=--verbose
          else
            VERBOSE_FLAG=
          fi
          fprime-util generate ${VERBOSE_FLAG} ${TARGET_PLATFORM}
        shell: bash
      - name: "Build"
        working-directory: ${{ inputs.build_location }}
        run: |
          if [ "${RUNNER_DEBUG:-0}" = "1" ]; then
            VERBOSE_FLAG=--verbose
          else
            VERBOSE_FLAG=
          fi
          fprime-util build -j8 ${VERBOSE_FLAG} ${TARGET_PLATFORM}
        shell: bash

  runUT:
    if: ${{ inputs.run_unit_tests }}
    runs-on: ${{ inputs.runs_on }}
    name: "Unit Tests"
    env:
      FPRIME_LOCATION: ${{ inputs.fprime_location }}
      TARGET_PLATFORM: ${{ inputs.target_platform }}
    steps:
      - name: "Checkout target repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_ref }}
      - name: "Overlay current F´ revision"
        uses: actions/checkout@v4
        with:
          submodules: true
          path: ${{ inputs.fprime_location }}
      - name: "Install requirements.txt"
        run: |
          pip3 install -r ${FPRIME_LOCATION}/requirements.txt
        shell: bash
      - name: "Install ZLIB development library"
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
        shell: bash
      - name: "Generate UT build cache"
        working-directory: ${{ inputs.build_location }}
        run: |
          if [ "${RUNNER_DEBUG:-0}" = "1" ]; then
            VERBOSE_FLAG=--verbose
          else
            VERBOSE_FLAG=
          fi
          fprime-util generate --ut ${VERBOSE_FLAG} ${TARGET_PLATFORM}
        shell: bash
      - name: "Build UTs"
        working-directory: ${{ inputs.build_location }}
        run: |
          if [ "${RUNNER_DEBUG:-0}" = "1" ]; then
            VERBOSE_FLAG=--verbose
          else
            VERBOSE_FLAG=
          fi
          fprime-util build --ut -j8 ${VERBOSE_FLAG} ${TARGET_PLATFORM}
        shell: bash
      - name: "Run Unit Tests"
        continue-on-error: false
        working-directory: ${{ inputs.build_location }}
        run: |
          if [ "${RUNNER_DEBUG:-0}" = "1" ]; then
            VERBOSE_FLAG=--verbose
          else
            VERBOSE_FLAG=
          fi
          fprime-util check -j8 ${VERBOSE_FLAG} ${TARGET_PLATFORM} --pass-through --output-on-failure
        shell: bash

      - name: "Install AArch64 cross-compilation toolchain"
        if: ${{ !inputs.skip_aarch64_build }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu ninja-build zlib1g-dev
        shell: bash
      - name: "Build zlib for ARM64"
        if: ${{ !inputs.skip_aarch64_build }}
        run: |
          wget https://github.com/madler/zlib/releases/download/v1.3/zlib-1.3.tar.gz
          tar -xzf zlib-1.3.tar.gz
          cd zlib-1.3
          CC=aarch64-linux-gnu-gcc AR=aarch64-linux-gnu-ar RANLIB=aarch64-linux-gnu-ranlib ./configure --prefix=/usr/aarch64-linux-gnu
          make
          sudo make install
        shell: bash
      - name: "Generate AArch64 Linux Build Cache"
        if: ${{ !inputs.skip_aarch64_build }}
        working-directory: ${{ inputs.build_location }}
        run: |
          export CMAKE_PREFIX_PATH=/usr/aarch64-linux-gnu:$CMAKE_PREFIX_PATH
          fprime-util generate aarch64-linux
      - name: "Build AArch64 Linux"
        if: ${{ !inputs.skip_aarch64_build }}
        working-directory: ${{ inputs.build_location }}
        run: |
          export CMAKE_PREFIX_PATH=/usr/aarch64-linux-gnu:$CMAKE_PREFIX_PATH
          fprime-util build aarch64-linux
      - name: "Prepare artifacts"
        if: ${{ !inputs.skip_aarch64_build }}
        working-directory: ${{ inputs.build_location }}
        run: |
          mkdir -p aarch64-linux-artifacts
          # Copy source directories that contain integration tests
          if [ -d "ManagerWorker" ]; then
            cp -r ManagerWorker aarch64-linux-artifacts/
          fi
          # Copy aarch64-linux build artifacts (dictionaries, binaries) into the expected structure
          if [ -d "./build-artifacts/aarch64-linux/ManagerWorker" ]; then
            mkdir -p aarch64-linux-artifacts/ManagerWorker
            cp -r ./build-artifacts/aarch64-linux/ManagerWorker/* aarch64-linux-artifacts/ManagerWorker/
          fi
      - name: "Archive Build Artifacts"
        if: ${{ !inputs.skip_aarch64_build }}
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-linux-artifacts
          path: ${{ inputs.build_location }}/aarch64-linux-artifacts
          retention-days: 5

