# This workflow is intended for reuse by other workflows and will not run directly (no triggers).
# The behavior is to build an external F´ project (e.g. fprime-community/system-reference) using
# the current F´ version.
name: "F´ Project Builder - Reusable Workflow"

on:
  workflow_call:
    inputs:
      build_location:
        description: "Path to F´ module to build. If run_integration_tests is true, this must be a path to the deployment."
        required: true
        type: string
      target_repository:
        description: "Additional external repository to checkout (<owner>/<repo>)"
        required: true
        type: string
      run_unit_tests:
        description: "Run an additional job in parallel to run unit tests."
        required: false
        type: boolean
        default: true
      run_integration_tests:
        description: "Run an additional job in parallel to run integration tests (pytest)."
        required: false
        type: boolean
        default: false
      project_root:
        description: "Path to the root of the F´ project. This is used to find artifacts directory for integration tests."
        required: false
        type: string
        default: "."
      fprime_location:
        description: "Relative path from the external project root to its F´ submodule"
        required: false
        type: string
        default: "./fprime"
      runs_on:
        description: "Platform to run on. Defaults to ubuntu-22.04"
        required: false
        type: string
        default: "ubuntu-22.04"
      target_platform:
        description: "Target platform to pass to fprime-util"
        required: false
        type: string
        default: ""
      target_ref:
        description: "Branch on target to checkout"
        required: false
        type: string
        default: "devel"

jobs:

  build:
    runs-on: ${{ inputs.runs_on }}
    name: "Build"
    steps:
      - name: "Checkout target repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive 
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_ref }}
      - name: "Overlay current F´ revision"
        uses: actions/checkout@v4
        with:
          submodules: true
          path: ${{ inputs.fprime_location }}
      - name: "Install F´ and Project requirements.txt"
        run: |
          pip3 install -r ${{ inputs.fprime_location }}/requirements.txt
        shell: bash
      - name: "Generate build cache"
        working-directory: ${{ inputs.build_location }}
        run: |
          fprime-util generate ${{ runner.debug == '1' && '--verbose' || '' }} ${{ inputs.target_platform }}
        shell: bash
      - name: "Build"
        working-directory: ${{ inputs.build_location }}
        run: |
          fprime-util build -j8 ${{ runner.debug == '1' && '--verbose' || '' }} ${{ inputs.target_platform }}
        shell: bash
      - if: ${{ inputs.run_integration_tests}}
        name: "Archive Build Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ${{ inputs.project_root }}/build-artifacts


  runUT:
    if: ${{ inputs.run_unit_tests }}
    runs-on: ${{ inputs.runs_on }}
    name: "Unit Tests"
    steps:
      - name: "Checkout target repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_ref }}
      - name: "Overlay current F´ revision"
        uses: actions/checkout@v4
        with:
          submodules: true
          path: ${{ inputs.fprime_location }}
      - name: "Install requirements.txt"
        run: |
          pip3 install -r ${{ inputs.fprime_location }}/requirements.txt
        shell: bash
      - name: "Generate UT build cache"
        working-directory: ${{ inputs.build_location }}
        run: |
          fprime-util generate --ut ${{ runner.debug == '1' && '--verbose' || '' }} ${{ inputs.target_platform }}
        shell: bash
      - name: "Build UTs"
        working-directory: ${{ inputs.build_location }}
        run: |
          fprime-util build --ut -j8 ${{ runner.debug == '1' && '--verbose' || '' }} ${{ inputs.target_platform }}
        shell: bash
      - name: "Run Unit Tests"
        working-directory: ${{ inputs.build_location }}
        run: |
          fprime-util check -j8 ${{ runner.debug == '1' && '--verbose' || '' }} ${{ inputs.target_platform }}
        shell: bash

  integration-tests:
    if: ${{ inputs.run_integration_tests }}
    runs-on: ${{ inputs.runs_on }}
    name: "Integration Tests"
    needs: build
    steps:
      - name: "Checkout target repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_ref }}
      - name: "Overlay current F´ revision"
        uses: actions/checkout@v4
        with:
          submodules: true
          path: ${{ inputs.fprime_location }}
      - name: "Install F´ and Project requirements.txt"
        run: |
          pip3 install -r ${{ inputs.fprime_location }}/requirements.txt
          if [ -f ./requirements.txt ]; then
            pip3 install -r ./requirements.txt
          fi
        shell: bash
      - name: "Download Build Artifacts"
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ${{ inputs.project_root }}/build-artifacts
      - name: "Fix permissions"
        run: chmod -R +x ${{ inputs.project_root }}/build-artifacts
      - name: "Start up GDS"
        working-directory: ${{ inputs.build_location }}
        run: |
          mkdir -p gds-logs
          fprime-gds --gui none -l gds-logs &
          sleep 10
      - name: "Run Integration Tests"
        working-directory: ${{ inputs.project_root }}
        run: pytest --ignore=lib
