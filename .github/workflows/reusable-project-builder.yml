# This workflow is intended for reuse by other workflows and will not run directly (no triggers).
# The behavior is to build an external F´ project (e.g. fprime-community/system-reference) using
# the current F´ version.
name: "F´ Project Builder - Reusable Workflow"

on:
  workflow_call:
    inputs:
      build_location:
        description: "Path to F´ module to build. E.g. MyDeployment/"
        required: true
        type: string
      target_repository:
        description: "Additional external repository to checkout (<owner>/<repo>)"
        required: true
        type: string
      run_unit_tests:
        description: "Run an additional job in parallel to run unit tests."
        required: false
        type: boolean
        default: true
      fprime_location:
        description: "Relative path from the external project root to its F´ submodule"
        required: false
        type: string
        default: "./fprime"
      runs_on:
        description: "Platform to run on. Defaults to ubuntu-22.04"
        required: false
        type: string
        default: "ubuntu-22.04"
      target_platform:
        description: "Target platform to pass to fprime-util"
        required: false
        type: string
        default: ""
      target_ref:
        description: "Branch on target to checkout"
        required: false
        type: string
        default: "devel"
      skip_aarch64_build:
        description: "Skip ARM64 cross-compilation build"
        required: false
        type: boolean
        default: false
      openssl_version:
        description: "OpenSSL version to build (static) and expose via OPENSSL_ROOT_DIR before generating, e.g. 3.5.8. Empty skips this."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:

  build:
    runs-on: ${{ inputs.runs_on }}
    name: "Build"
    env:
      FPRIME_LOCATION: ${{ inputs.fprime_location }}
      TARGET_PLATFORM: ${{ inputs.target_platform }}
    steps:
      - name: "Setup output-cleaner"
        uses: nasa/fprime-actions/output-cleaner@devel
      - name: "Checkout target repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive 
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_ref }}
      - name: "Overlay current F´ revision"
        uses: actions/checkout@v4
        with:
          submodules: true
          path: ${{ inputs.fprime_location }}
      - name: "Install requirements.txt"
        run: |
          pip3 install -r ${FPRIME_LOCATION}/requirements.txt
        shell: bash
      # OpenSSL is built as static libraries so the produced binaries carry no runtime
      # dependency on a non-system libcrypto (artifacts are run on other jobs/runners)
      - name: "Restore OpenSSL ${{ inputs.openssl_version }} from cache"
        if: inputs.openssl_version != ''
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: ~/openssl
          key: openssl-${{ inputs.openssl_version }}-static-${{ inputs.runs_on }}
      - name: "Build OpenSSL ${{ inputs.openssl_version }}"
        if: inputs.openssl_version != '' && steps.openssl-cache.outputs.cache-hit != 'true'
        env:
          OPENSSL_VERSION: ${{ inputs.openssl_version }}
        run: |
          SRC_DIR="${RUNNER_TEMP}/openssl-src"
          RELEASE_URL="https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}"
          mkdir -p "${SRC_DIR}"
          cd "${SRC_DIR}"
          curl -fsSL -o openssl.tar.gz "${RELEASE_URL}/openssl-${OPENSSL_VERSION}.tar.gz"
          curl -fsSL -o openssl.tar.gz.sha256 "${RELEASE_URL}/openssl-${OPENSSL_VERSION}.tar.gz.sha256"
          echo "$(cut -d' ' -f1 openssl.tar.gz.sha256)  openssl.tar.gz" | sha256sum -c -
          tar -xzf openssl.tar.gz --strip-components=1
          ./Configure --prefix="${HOME}/openssl" --libdir=lib no-shared no-tests no-docs
          make -j"$(nproc)" build_libs
          make install_dev
        shell: bash
      - name: "Select OpenSSL ${{ inputs.openssl_version }}"
        if: inputs.openssl_version != ''
        run: echo "OPENSSL_ROOT_DIR=${HOME}/openssl" >> "${GITHUB_ENV}"
        shell: bash
      - name: "Generate build cache"
        working-directory: ${{ inputs.build_location }}
        run: |
          if [ "${RUNNER_DEBUG:-0}" = "1" ]; then
            VERBOSE_FLAG=--verbose
          else
            VERBOSE_FLAG=
          fi
          fprime-util generate ${VERBOSE_FLAG} ${TARGET_PLATFORM} 2>&1 | output-cleaner
        shell: bash
      - name: "Build"
        working-directory: ${{ inputs.build_location }}
        run: |
          if [ "${RUNNER_DEBUG:-0}" = "1" ]; then
            VERBOSE_FLAG=--verbose
          else
            VERBOSE_FLAG=
          fi
          fprime-util build -j8 ${VERBOSE_FLAG} ${TARGET_PLATFORM} 2>&1 | output-cleaner
        shell: bash
      - name: "Upload build artifacts"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: examples-build-artifacts
          path: |
            ${{ inputs.build_location }}/build-artifacts/
            build-artifacts/
          if-no-files-found: ignore
          retention-days: 1

  runUT:
    if: ${{ inputs.run_unit_tests }}
    runs-on: ${{ inputs.runs_on }}
    name: "Unit Tests"
    env:
      FPRIME_LOCATION: ${{ inputs.fprime_location }}
      TARGET_PLATFORM: ${{ inputs.target_platform }}
    steps:
      - name: "Setup output-cleaner"
        uses: nasa/fprime-actions/output-cleaner@devel
      - name: "Checkout target repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_ref }}
      - name: "Overlay current F´ revision"
        uses: actions/checkout@v4
        with:
          submodules: true
          path: ${{ inputs.fprime_location }}
      - name: "Install requirements.txt"
        run: |
          pip3 install -r ${FPRIME_LOCATION}/requirements.txt
        shell: bash
      - name: "Restore OpenSSL ${{ inputs.openssl_version }} from cache"
        if: inputs.openssl_version != ''
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: ~/openssl
          key: openssl-${{ inputs.openssl_version }}-static-${{ inputs.runs_on }}
      - name: "Build OpenSSL ${{ inputs.openssl_version }}"
        if: inputs.openssl_version != '' && steps.openssl-cache.outputs.cache-hit != 'true'
        env:
          OPENSSL_VERSION: ${{ inputs.openssl_version }}
        run: |
          SRC_DIR="${RUNNER_TEMP}/openssl-src"
          RELEASE_URL="https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}"
          mkdir -p "${SRC_DIR}"
          cd "${SRC_DIR}"
          curl -fsSL -o openssl.tar.gz "${RELEASE_URL}/openssl-${OPENSSL_VERSION}.tar.gz"
          curl -fsSL -o openssl.tar.gz.sha256 "${RELEASE_URL}/openssl-${OPENSSL_VERSION}.tar.gz.sha256"
          echo "$(cut -d' ' -f1 openssl.tar.gz.sha256)  openssl.tar.gz" | sha256sum -c -
          tar -xzf openssl.tar.gz --strip-components=1
          ./Configure --prefix="${HOME}/openssl" --libdir=lib no-shared no-tests no-docs
          make -j"$(nproc)" build_libs
          make install_dev
        shell: bash
      - name: "Select OpenSSL ${{ inputs.openssl_version }}"
        if: inputs.openssl_version != ''
        run: echo "OPENSSL_ROOT_DIR=${HOME}/openssl" >> "${GITHUB_ENV}"
        shell: bash

      - name: "Generate UT build cache"
        working-directory: ${{ inputs.build_location }}
        run: |
          if [ "${RUNNER_DEBUG:-0}" = "1" ]; then
            VERBOSE_FLAG=--verbose
          else
            VERBOSE_FLAG=
          fi
          fprime-util generate --ut ${VERBOSE_FLAG} ${TARGET_PLATFORM} 2>&1 | output-cleaner
        shell: bash
      - name: "Build UTs"
        working-directory: ${{ inputs.build_location }}
        run: |
          if [ "${RUNNER_DEBUG:-0}" = "1" ]; then
            VERBOSE_FLAG=--verbose
          else
            VERBOSE_FLAG=
          fi
          fprime-util build --ut -j8 ${VERBOSE_FLAG} ${TARGET_PLATFORM} 2>&1 | output-cleaner
        shell: bash
      - name: "Run Unit Tests"
        continue-on-error: false
        working-directory: ${{ inputs.build_location }}
        run: |
          if [ "${RUNNER_DEBUG:-0}" = "1" ]; then
            VERBOSE_FLAG=--verbose
          else
            VERBOSE_FLAG=
          fi
          fprime-util check -j8 ${VERBOSE_FLAG} ${TARGET_PLATFORM} --pass-through --output-on-failure
        shell: bash
      - name: "Archive test logs"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-logs
          path: ${{ inputs.build_location }}/build-*/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 5

