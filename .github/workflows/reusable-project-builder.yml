# This workflow is intended for reuse by other workflows and will not run directly (no triggers).
# The behavior is to build an external F´ project (e.g. fprime-community/system-reference) using
# the current F´ version.
name: "F´ Project Builder - Reusable Workflow"

on:
  workflow_call:
    inputs:
      build_location:
        description: "Path to F´ module to build. E.g. MyDeployment/"
        required: true
        type: string
      target_repository:
        description: "Additional external repository to checkout (<owner>/<repo>)"
        required: true
        type: string
      run_unit_tests:
        description: "Run an additional job in parallel to run unit tests."
        required: false
        type: boolean
        default: true
      fprime_location:
        description: "Relative path from the external project root to its F´ submodule"
        required: false
        type: string
        default: "./fprime"
      runs_on:
        description: "Platform to run on. Defaults to ubuntu-22.04"
        required: false
        type: string
        default: "ubuntu-22.04"
      target_platform:
        description: "Target platform to pass to fprime-util"
        required: false
        type: string
        default: ""
      target_ref:
        description: "Branch on target to checkout"
        required: false
        type: string
        default: "devel"

jobs:

  build:
    runs-on: ${{ inputs.runs_on }}
    name: "Build"
    env:
      FPRIME_LOCATION: ${{ inputs.fprime_location }}
      TARGET_PLATFORM: ${{ inputs.target_platform }}
    steps:
      - name: "Checkout target repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive 
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_ref }}
      - name: "Overlay current F´ revision"
        uses: actions/checkout@v4
        with:
          submodules: true
          path: ${{ inputs.fprime_location }}
      - name: "Install requirements.txt"
        run: |
          pip3 install -r ${FPRIME_LOCATION}/requirements.txt
        shell: bash
      - name: "Generate build cache"
        working-directory: ${{ inputs.build_location }}
        run: |
          if [ "${RUNNER_DEBUG:-0}" = "1" ]; then
            VERBOSE_FLAG=--verbose
          else
            VERBOSE_FLAG=
          fi
          fprime-util generate ${VERBOSE_FLAG} ${TARGET_PLATFORM}
        shell: bash
      - name: "Build"
        working-directory: ${{ inputs.build_location }}
        run: |
          if [ "${RUNNER_DEBUG:-0}" = "1" ]; then
            VERBOSE_FLAG=--verbose
          else
            VERBOSE_FLAG=
          fi
          fprime-util build -j8 ${VERBOSE_FLAG} ${TARGET_PLATFORM}
        shell: bash

  runUT:
    if: ${{ inputs.run_unit_tests }}
    runs-on: ${{ inputs.runs_on }}
    name: "Unit Tests"
    env:
      FPRIME_LOCATION: ${{ inputs.fprime_location }}
      TARGET_PLATFORM: ${{ inputs.target_platform }}
    steps:
      - name: "Checkout target repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_ref }}
      - name: "Overlay current F´ revision"
        uses: actions/checkout@v4
        with:
          submodules: true
          path: ${{ inputs.fprime_location }}
      - name: "Install requirements.txt"
        run: |
          pip3 install -r ${FPRIME_LOCATION}/requirements.txt
        shell: bash
      - name: "Generate UT build cache"
        working-directory: ${{ inputs.build_location }}
        run: |
          if [ "${RUNNER_DEBUG:-0}" = "1" ]; then
            VERBOSE_FLAG=--verbose
          else
            VERBOSE_FLAG=
          fi
          fprime-util generate --ut ${VERBOSE_FLAG} ${TARGET_PLATFORM}
        shell: bash
      - name: "Build UTs"
        working-directory: ${{ inputs.build_location }}
        run: |
          if [ "${RUNNER_DEBUG:-0}" = "1" ]; then
            VERBOSE_FLAG=--verbose
          else
            VERBOSE_FLAG=
          fi
          fprime-util build --ut -j8 ${VERBOSE_FLAG} ${TARGET_PLATFORM}
        shell: bash
      - name: "Run Unit Tests"
        continue-on-error: true
        working-directory: ${{ inputs.build_location }}
        run: |
          if [ "${RUNNER_DEBUG:-0}" = "1" ]; then
            VERBOSE_FLAG=--verbose
          else
            VERBOSE_FLAG=
          fi
          fprime-util check -j8 ${VERBOSE_FLAG} ${TARGET_PLATFORM} --pass-through --output-on-failure
        shell: bash

      - name: "Install AArch64 cross-compilation toolchain"
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu ninja-build
        shell: bash
      - name: "Generate AArch64 Linux Build Cache"
        working-directory: ${{ inputs.build_location }}
        run: |
          fprime-util generate aarch64-linux
      - name: "Build AArch64 Linux"
        working-directory: ${{ inputs.build_location }}
        run: |
          fprime-util build aarch64-linux
      - name: "Prepare artifacts"
        working-directory: ${{ inputs.build_location }}
        run: |
          mkdir -p aarch64-linux-artifacts
          cp -r ./build-artifacts aarch64-linux-artifacts
          if [ -d "ExamplesDeployment/test/int" ]; then
            cp -r ExamplesDeployment/test/int aarch64-linux-artifacts/int
          fi
      - name: "Archive Build Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-linux-artifacts
          path: ${{ inputs.build_location }}/aarch64-linux-artifacts
          retention-days: 5

