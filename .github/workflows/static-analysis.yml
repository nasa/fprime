# Static analysis for the F' framework: CodeQL (security + JPL coding
# standard), cppcheck, and clang-tidy.
#
# Consolidates the former "Code Scan: CodeQL Security", "Code Scan: JPL
# Coding Standard", "Code Scan: CppCheck", and the Framework "Quality"
# (clang-tidy) jobs into a single workflow.
#
# Scheduling policy:
#   - pull_request: CodeQL security scan + cppcheck (the security gates)
#   - nightly cron (2:00 AM Pacific): full suite incl. the JPL standard
#     packs and clang-tidy; SARIF uploads and per-module findings are
#     published from the nightly run on devel (formerly the push run).

name: "Static Analysis"

on:
  pull_request:
    branches: [ devel, release/** ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/agents/**'
  schedule:
    - cron: "0 10 * * *"  # 2:00 AM Pacific (PST)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql-security:
    name: "CodeQL Security"
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp', 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/actions/codeql/security-pack.yml

    - if: ${{ matrix.language == 'cpp' }}
      name: Build
      run: |
          python3 -m venv ./fprime-venv
          . ./fprime-venv/bin/activate
          pip install -U setuptools setuptools_scm wheel pip
          pip install -r ./requirements.txt
          fprime-util generate
          fprime-util build --all

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
        upload: never
        output: sarif-results

    # For compiled languages the config-file paths-ignore does NOT remove
    # results: every file reached by the traced build is analyzed and reported,
    # so exclusions are applied here by filtering the SARIF before upload.
    # CMake-internal generated sources (try_compile checks, compiler id,
    # feature tests) and third-party dependencies fetched by CMake (e.g.
    # googletest via FetchContent) are not first-party code.
    # Switch-shape rules (long-switch, trivial-switch) are additionally
    # excluded for F Prime autocoded sources in the build cache, where the
    # switch structure is dictated by the code generator.
    - if: ${{ matrix.language == 'cpp' }}
      name: Filter CMake-internal and third-party paths out of SARIF
      uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
      with:
        patterns: |
          -**/CMakeFiles/**
          -**/_deps/**
          -**/build-fprime-*/**:cpp/long-switch
          -**/build-fprime-*/**:cpp/trivial-switch
        input: sarif-results/cpp.sarif
        output: sarif-results/cpp.sarif

    # Only publish alerts to the GitHub code-scanning UI for the default
    # branch (devel). The analysis still runs on PRs so regressions are
    # caught, but results are not uploaded, preventing stale branches from
    # accumulating alerts.
    - name: Upload SARIF
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/devel'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: sarif-results/${{ matrix.language }}.sarif
        category: "/language:${{matrix.language}}"

    # Hand the filtered SARIF to the publish-findings job so per-module
    # findings can be published without re-running CodeQL.
    - name: Upload SARIF artifact for publishing
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: codeql-sarif-${{ matrix.language }}
        path: sarif-results/${{ matrix.language }}.sarif

  # Publish per-module findings (line, rule, severity) to the baseline
  # branch (coverage/<ref>) and regenerate the checklist landing page.
  # Runs only on the nightly run-for-record; consumes the analyze job's
  # filtered SARIF so CodeQL is never re-run.  The concurrency group is
  # shared with every other baseline publisher (coverage-update, future
  # int-coverage) so writers to the branch serialize across workflows.
  publish-security-findings:
    name: Publish per-module findings (Security)
    needs: codeql-security
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      # Read dismissed code-scanning alerts so UI dismissals are excluded
      # from the published findings tables.
      security-events: read
    concurrency:
      group: baseline-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download SARIF artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: codeql-sarif-*
          path: sarif-results
          merge-multiple: true
      - name: Publish findings to baseline branch
        uses: nasa/fprime-actions/codeql-publish@devel
        with:
          check-label: "CodeQL Security"
          sarif-files: |
            sarif-results/cpp.sarif
            sarif-results/python.sarif

  # JPL coding standard packs: nightly only (findings are published from
  # the run-for-record; the security scan above gates PRs).
  codeql-jpl:
    name: "CodeQL JPL Standard"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
        config-file: ['jpl-standard-pack-1.yml', 'jpl-standard-pack-2.yml', 'jpl-standard-pack-3.yml', 'jpl-standard-known-autocode-issues.yml']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Run jobs in parallel for each config-file
        config-file: ./.github/actions/codeql/${{ matrix.config-file }}

    - name: Build
      run: |
          python3 -m venv ./fprime-venv
          . ./fprime-venv/bin/activate
          pip install -U setuptools setuptools_scm wheel pip
          pip install -r ./requirements.txt
          fprime-util generate
          fprime-util build --all

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        upload: never
        output: sarif-results

    # For compiled languages the config-file paths-ignore does NOT remove
    # results: every file reached by the traced build is analyzed and reported,
    # so exclusions are applied here by filtering the SARIF before upload.

    # CMake-internal generated sources (try_compile checks, compiler id,
    # feature tests), third-party dependencies fetched by CMake (e.g.
    # googletest via FetchContent), and vendored third-party code (libcrc)
    # are not first-party code
    - name: Filter CMake-internal and third-party paths out of SARIF
      uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
      with:
        patterns: |
          -**/CMakeFiles/**
          -**/_deps/**
          -Utils/Hash/libcrc/**
          -fprime-venv/**
        input: sarif-results/cpp.sarif
        output: sarif-results/cpp.sarif

    # Autocoded C++ in the build caches is not hand-maintained, so the rules in
    # the no-autocode run guard only hand-written sources
    - name: Filter build paths out of SARIF (no-autocode run)
      if: matrix.config-file == 'jpl-standard-known-autocode-issues.yml'
      uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
      with:
        patterns: |
          -**/build-fprime-*/**
        input: sarif-results/cpp.sarif
        output: sarif-results/cpp.sarif

    # Only publish alerts to the GitHub code-scanning UI for the default
    # branch (devel).
    - name: Upload SARIF
      if: github.ref == 'refs/heads/devel'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: sarif-results/cpp.sarif

    # Hand the filtered SARIF to the publish-findings job so per-module
    # findings can be published without re-running CodeQL.  Each matrix leg
    # writes cpp.sarif, so rename to the config name for a unique file when
    # the artifacts are merged.
    - name: Rename SARIF for publishing
      env:
        CONFIG_FILE: ${{ matrix.config-file }}
      run: cp sarif-results/cpp.sarif "sarif-results/${CONFIG_FILE%.yml}.sarif"
    - name: Upload SARIF artifact for publishing
      uses: actions/upload-artifact@v4
      with:
        name: codeql-jpl-sarif-${{ matrix.config-file }}
        path: sarif-results/jpl-standard-*.sarif

  # Publish per-module findings (line, rule, severity) to the baseline
  # branch (coverage/<ref>) under the codeql-jpl check, and regenerate the
  # checklist landing page.
  publish-jpl-findings:
    name: Publish per-module findings (JPL Standard)
    needs: codeql-jpl
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      # Read dismissed code-scanning alerts so UI dismissals are excluded
      # from the published findings tables.
      security-events: read
    concurrency:
      group: baseline-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download SARIF artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: codeql-jpl-sarif-*
          path: sarif-results
          merge-multiple: true
      - name: Publish findings to baseline branch
        uses: nasa/fprime-actions/codeql-publish@devel
        with:
          codeql-subdirectory: codeql-jpl
          check-label: "CodeQL JPL Standard"
          sarif-files: |
            sarif-results/jpl-standard-pack-1.sarif
            sarif-results/jpl-standard-pack-2.sarif
            sarif-results/jpl-standard-pack-3.sarif
            sarif-results/jpl-standard-known-autocode-issues.sarif

  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: "Checkout F' Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: ./.github/actions/setup

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install cppcheck xsltproc -y

      - name: Install sarif tool
        run: npm i -g @microsoft/sarif-multitool

      # With a CMake-based project, we get the list of files by setting up a build with CMAKE_EXPORT_COMPILE_COMMANDS=ON and
      # referencing the compile_commands.json file produced by the tool.  This will capture the correct include paths and
      # compile definitions based on how the source is actually compiled. See https://cppcheck.sourceforge.io/manual.html
      - name: Generate & build F'
        run: |
          fprime-util generate -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          fprime-util build --all --jobs "$(nproc || printf '%s\n' 1)"

          # Add EXCLUDE_FROM_ALL targets as we need to explicitly build them
          fprime-util build --target Svc_Subtopologies --jobs "$(nproc || printf '%s\n' 1)"
          fprime-util build --target Svc_GenericHub --jobs "$(nproc || printf '%s\n' 1)"
          echo CPPCHECK_OPTS=--project="$GITHUB_WORKSPACE/build-fprime-automatic-native/compile_commands.json" >> $GITHUB_ENV

      - name: Run cppcheck
        run: cppcheck --force --relative-paths=$(pwd) --inline-suppr --std=c++11 -j "$(nproc || printf '%s\n' 1)" --max-ctu-depth=16 --enable=warning,performance,portability --suppress=variableScope --inconclusive --xml $CPPCHECK_OPTS 2> cppcheck_err.xml

      - name: Convert cppcheck results to SARIF
        run: npx "@microsoft/sarif-multitool" convert "cppcheck_err.xml" --tool "CppCheck" --output "cppcheck_err.sarif"

      - name: Convert cppcheck results to Markdown & Integrate them in the workflow summary
        run: xsltproc .github/scripts/cppcheck-xml2text.xslt cppcheck_err.xml | tee $GITHUB_STEP_SUMMARY cppcheck_err.txt

      - name: Upload SARIF file to GitHub Code Scanning Alerts
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ github.workspace }}/cppcheck_err.sarif
          category: "cppcheck"

      - name: Archive static analysis artifacts to download and view
        uses: actions/upload-artifact@v7
        with:
          name: cppcheck-errors
          path: ./*cppcheck_err.*

      # Make the whole step fail if there is an error detected by cppcheck. By default, GitHub Actions enables the set -e.
      # See https://stackoverflow.com/questions/73066461/github-actions-why-an-intermediate-command-failure-in-shell-script-would-cause.
      - name: Check for reported errors
        run: tail -n 1 cppcheck_err.txt | grep -q '^\*\*0 error(s) reported\*\*$'

  # clang-tidy static analysis (formerly the Framework "Quality" job):
  # nightly only.
  clang-tidy:
    name: "Clang Tidy"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: "Checkout F' Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: "Setup F' Tools"
        uses: nasa/fprime-actions/setup@devel
        with:
          location: ${{ github.workspace }}
      - name: "Install clang-tidy"
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-12
      - name: "Generate with clang-tidy"
        shell: bash
        run: |
          fprime-util generate \
            -DCMAKE_C_COMPILER=gcc-10 \
            -DCMAKE_CXX_COMPILER=g++-10 \
            -DCMAKE_CXX_CLANG_TIDY="clang-tidy-12;--config-file=${{ github.workspace }}/release.clang-tidy"
      - name: "Build (static analysis runs during compilation)"
        shell: bash
        run: fprime-util build --all
