# Build verification for F´ framework and Ref deployment.
# Runs two parallel jobs to validate that the codebase compiles cleanly.

name: "Build"

on:
  push:
    branches: [ devel, release/** ]
  pull_request:
    branches: [ devel, release/** ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'devel') && !contains(github.ref, 'release/') }}

jobs:

  framework:
    name: "Framework Build"
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout F´ Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: "Setup F´ Tools"
        uses: nasa/fprime-actions/setup@devel
      - name: "Generate Build Cache"
        run: fprime-util generate
      - name: "Build All"
        run: fprime-util build --all -j8

  ref:
    name: "Ref Build"
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout F´ Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: "Setup F´ Tools"
        uses: nasa/fprime-actions/setup@devel
      - name: "Generate Build Cache"
        working-directory: Ref
        run: fprime-util generate
      - name: "Build"
        working-directory: Ref
        run: fprime-util build -j8
