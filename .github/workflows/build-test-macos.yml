# DEPRECATED (partially): macOS-Framework and macOS-Ref jobs have moved to framework-build.yml, framework-unit-tests.yml, ref-build.yml, and ref-unit-tests.yml (with macOS matrix entries).
# macOS-Integration still needs to be migrated to a dedicated workflow.

name: "CI [macOS]"

on:
  push:
    branches: [ devel, release/** ]
  pull_request:
    branches: [ devel, release/** ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'
# Cancel in-progress runs if a newer run is started on a given PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'devel') && !contains(github.ref, 'release/')}}

jobs:
  macOS-Integration:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - name: "Checkout F´ Repository"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12' 
    - uses: ./.github/actions/setup
    - name: Install coreutils
      run: brew install coreutils
    - name: F prime CI step
      run: ./ci/tests/30-ints.bash
      env:
        JOBS: 2
    # Archive the outputs
    - name: 'Archive Logs'
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ci-int-logs
        path: ci-logs.tar.gz
        retention-days: 5
