# Cross-compile and continuously soak test the LED blinker on AArch64 Linux
# Builds on release publication, then runs continuously until failure
# Cross-compile https://github.com/fprime-community/fprime-workshop-led-blinker

name: "External Repo: AArch64 Linux LedBlinker Soak Test"

on:
  release: 
    types: [published]
# New releases cancel running soak tests and start fresh
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  AARCH64_TOOLCHAIN_DIR: /tmp/aarch64-toolchain
  AARCH64_TOOLCHAIN_URL: https://developer.arm.com/-/media/Files/downloads/gnu-a/10.2-2020.11/binrel/gcc-arm-10.2-2020.11-x86_64-aarch64-none-linux-gnu.tar.xz
  ARM_TOOLS_PATH: /tmp/aarch64-toolchain

jobs:
  get-branch:
    name: "Get target branch"
    runs-on: ubuntu-22.04
    if: github.event_name == 'release'
    outputs:
      target-branch: ${{ steps.get-branch.outputs.target-branch }}
    steps:
      - uses: actions/checkout@v4
      - name: Get target branch
        id: get-branch
        uses: ./.github/workflows/reusable-get-pr-branch.yml
        with:
          target_repository: fprime-community/fprime-workshop-led-blinker

  cross-compilation:
    name: "Cross Compilation"
    runs-on: ubuntu-22.04
    needs: get-branch
    if: github.event_name == 'release' 
    steps:
      - name: "Checkout target repository"
        uses: actions/checkout@v4
        with:
          submodules: false
          repository: fprime-community/fprime-workshop-led-blinker
          ref: ${{ needs.get-branch.outputs.target-branch }}
      - name: "Overlay current F´ revision"
        uses: actions/checkout@v4
        with:
          submodules: true
          path: ./fprime
          fetch-depth: 0
      - uses: ./fprime/.github/actions/setup
        with:
          location: ./fprime
      - name: "Download and Setup AArch64 Linux Toolchain"
        run: |
          mkdir -p ${AARCH64_TOOLCHAIN_DIR}
          wget -q ${AARCH64_TOOLCHAIN_URL}
          tar -xf $(basename ${AARCH64_TOOLCHAIN_URL}) -C ${AARCH64_TOOLCHAIN_DIR} --strip-components 1
          echo "${AARCH64_TOOLCHAIN_DIR}/bin" >> $GITHUB_PATH
      - name: "Generate AArch64 Linux Build Cache"
        run: |
          fprime-util generate aarch64-linux
      - name: "Build AArch64 Linux"
        run: |
          fprime-util build aarch64-linux
      - name: "Prepare artifacts"
        run: |
          mkdir -p aarch64-linux-artifacts
          cp -r ./build-artifacts aarch64-linux-artifacts
          cp -r Components/Led/test/int aarch64-linux-artifacts
      - name: 'Archive Build Artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-linux-artifacts
          path: aarch64-linux-artifacts
          #Should be longer? We want scheduled runs to have access without needing to recompile
          retention-days: 365

  aarch64-soak-test:
    name: "aarch64 Soak Test"
    runs-on: [self-hosted, aarch64-linux]
    needs: cross-compilation
    timeout-minutes: 0  # No timeout, run until failure
    steps:
      - name: "Checkout F´ Repository"
        uses: actions/checkout@v4
        with:
          sparse-checkout: 'requirements.txt'
          sparse-checkout-cone-mode: false
      - name: "Setup environment"
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install -r requirements.txt
      - name: "Download Soak Artifacts"
        uses: actions/download-artifact@v4
        with:
          name: aarch64-linux-artifacts
      - name: "Start Continuous Soak Testing"
        run: |
          . venv/bin/activate
          echo "Soak testing started with fresh release at $(date)"
          
          # Setup GDS once
          OG_TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          mkdir -p ci-logs-soak-${OG_TIMESTAMP}
          
          echo "Starting F' GDS for continuous soak testing..."
          chmod +x ./aarch64-linux-artifacts/build-artifacts/aarch64-linux/LedBlinker/bin/LedBlinker
          fprime-gds --ip-client -d ./aarch64-linux-artifacts/build-artifacts/aarch64-linux/LedBlinker --logs ./ci-logs-soak-${OG_TIMESTAMP} &
          GDS_PID=$!
          
          # Wait for GDS to start
          sleep 10
          echo "GDS started with PID: $GDS_PID - beginning continuous soak testing"
          
          # Function to run a single test iteration
          run_test_iteration() {
            local iteration=$1
            local test_timestamp=$(date +%Y%m%d_%H%M%S)
            
            echo "=== Soak test iteration $iteration starting at $(date) ==="
            
            # Run the test
            if pytest --dictionary ./aarch64-linux-artifacts/build-artifacts/aarch64-linux/LedBlinker/dict/LedBlinkerTopologyDictionary.json ./aarch64-linux-artifacts/int/led_integration_tests.py -v --tb=short; then
              echo "=== Iteration $iteration PASSED at $(date) ==="
              return 0
            else
              echo "=== Iteration $iteration FAILED at $(date) ==="
              return 1
            fi
          }
          
          # Main continuous testing loop
          iteration=1
          
          echo "Starting continuous soak testing - will run until failure"
          echo "Testing every 30 minutes with the same GDS instance"
          
          while true; do
            # Run test iteration
            if ! run_test_iteration $iteration; then
              echo "SOAK TEST FAILURE: Test iteration $iteration failed at $(date)"
              echo "Stopping continuous soak testing"
              
              # Cleanup GDS process
              echo "Cleaning up GDS process..."
              kill $GDS_PID 2>/dev/null || true
              wait $GDS_PID 2>/dev/null || true
              
              echo "SOAK TEST FAILURE - Continuous soak testing stopped due to failure"
              exit 1
            fi
            
            iteration=$((iteration + 1))
            
            # Log progress periodically
            if [ $((iteration % 10)) -eq 0 ]; then
              echo "=== Milestone: Completed $iteration successful iterations ==="
              echo "=== Continuous soak testing still running strong ==="
            fi
            
            # Sleep for 30 minutes before next iteration
            echo "Sleeping 30 minutes before iteration $iteration..."
            sleep 1800
          done
      - name: 'Archive Soak Test Logs'
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-logs-${{ github.run_number }}
          path: ci-logs-soak-*
          retention-days: 30
