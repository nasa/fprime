# Soak-test setup for the Zephyr Reference deployment on Raspberry Pi Pico 2.
#
# Cross-compiles https://github.com/fprime-community/fprime-zephyr-reference
# and flashes it to a Pico 2 connected to the self-hosted runner via UART + SWD.
#
# Pairs with ext-pico2-zephyr-reference-soak-test.yml.

name: "Soak Setup: Pico 2 Zephyr Reference"

on:
  release:
    types: [published]
  workflow_dispatch:

# Group shared with soak test workflow, new setup should cancel all old setup and tests
concurrency:
  group: pico2-soak
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-compilation:
    name: "Cross Compilation"
    runs-on: [self-hosted, macOS]  # Use Mac runner
    steps:
      - name: "Clean stale git locks (macOS)"
        run: |
          # Remove any stale git lock files from previous runs
          if [ -d "${{ github.workspace }}" ]; then
            find "${{ github.workspace }}" -name "*.lock" -type f -delete 2>/dev/null || true
          fi
        continue-on-error: true

      - name: "Setup external repository + overlay F´"
        uses: moisesmata/fprime-actions/external-repository-setup@soak-actions-improvements
        with:
          target_repository: fprime-community/fprime-zephyr-reference
          # On release, build the tagged revision; otherwise (workflow_dispatch) build devel.
          target_ref: ${{ github.event.release.tag_name || 'devel' }}

      - name: "Install Zephyr SDK and dependencies (macOS)"
        run: |
          # Check if Homebrew is installed
          if ! command -v brew &> /dev/null; then
            echo "Homebrew not found. Please install from https://brew.sh"
            exit 1
          fi

          # Install Zephyr dependencies via Homebrew (ignore if already installed)
          brew install cmake ninja gperf python3 ccache qemu dtc wget || true

          # Install west (without --user flag in GitHub Actions)
          pip3 install west

          # Note: Zephyr SDK for macOS should be installed manually or via setup script
          # Download from: https://github.com/zephyrproject-rtos/sdk-ng/releases

          # Check if Zephyr SDK is installed
          if [ -z "${ZEPHYR_SDK_INSTALL_DIR:-}" ]; then
            echo "ZEPHYR_SDK_INSTALL_DIR not set. Checking default location..."
            if [ -d "${HOME}/zephyr-sdk-0.16.8" ]; then
              echo "Found Zephyr SDK at ${HOME}/zephyr-sdk-0.16.8"
              echo "ZEPHYR_SDK_INSTALL_DIR=${HOME}/zephyr-sdk-0.16.8" >> $GITHUB_ENV
            elif [ -d "/opt/zephyr-sdk-0.16.8" ]; then
              echo "Found Zephyr SDK at /opt/zephyr-sdk-0.16.8"
              echo "ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk-0.16.8" >> $GITHUB_ENV
            else
              echo "::warning::Zephyr SDK not found. Build may fail."
              echo "Install from: https://github.com/zephyrproject-rtos/sdk-ng/releases"
            fi
          fi

      - name: "Cross compile for Pico 2"
        run: |
          fprime-util generate -DBOARD=rpi_pico2/rp2350a/m33
          fprime-util build --target FprimeZephyrReference_ReferenceDeployment

      - name: "Stage artifacts for soak"
        run: |
          mkdir -p artifacts/build-artifacts
          # Copy hex file
          cp build-artifacts/zephyr.hex artifacts/build-artifacts/
          # Copy dictionary
          mkdir -p artifacts/build-artifacts/zephyr/fprime-zephyr-deployment/dict
          cp build-artifacts/zephyr/fprime-zephyr-deployment/dict/*TopologyDictionary.json \
            artifacts/build-artifacts/zephyr/fprime-zephyr-deployment/dict/
          # Copy integration tests
          cp -r FprimeZephyrReference/ReferenceDeployment/test/int artifacts/int

      - name: "Archive soak artifact"
        uses: actions/upload-artifact@v4
        with:
          name: pico2-soak-artifact
          path: artifacts/
          retention-days: 5

  deploy:
    name: "Deploy Soak Services"
    runs-on: [self-hosted, ARM64, pico2-soak]
    needs: cross-compilation
    steps:
      - name: "Download soak artifact"
        uses: actions/download-artifact@v4
        with:
          name: pico2-soak-artifact
          path: artifacts

      - name: "Deploy FSW + persistent GDS services"
        uses: moisesmata/fprime-actions/soak-setup@soak-actions-improvements
        with:
          deployment-name: pico2-ref
          platform: pico2
          fsw-device: /dev/pico2
          fsw-hex: artifacts/build-artifacts/zephyr.hex
          gds-args: "--communication-selection uart --uart-device /dev/pico2 --uart-baud 115200 --uart-skip-port-check --zmq-transport ipc:///tmp/fprime-server-pico2-in ipc:///tmp/fprime-server-pico2-out"
