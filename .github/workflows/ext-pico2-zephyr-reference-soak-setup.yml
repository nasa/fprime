# Soak-test setup for the Zephyr Reference deployment on Raspberry Pi Pico 2.
#
# Does a run of reusable-project-ci.yml to build, flash,
# and initially test the Pico 2, then deploys a persistent GDS service for soak testing.
#
# Pairs with ext-pico2-zephyr-reference-soak-test.yml.

name: "Soak Setup: Pico 2 Zephyr Reference"

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: pico2-soak
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: "Zephyr Build"
    uses: ./.github/workflows/reusable-project-ci.yml
    with:
      target_repository: fprime-community/fprime-zephyr-reference
      target_ref: ${{ github.event.release.tag_name || 'devel' }}
      ci_config_file: ./lib/fprime-zephyr/ci/sample-configs/pico2.yml
      runs_on_int: pico2-soak

  # Now start the persistent GDS service for soak testing
  start-persistent-gds:
    name: "Start Soak GDS"
    needs: build
    runs-on: [self-hosted, pico2-soak]
    steps:
      - name: "Set up target repository (for tests + dictionary)"
        uses: nasa/fprime-actions/external-repository-setup@devel
        with:
          target_repository: fprime-community/fprime-zephyr-reference
          target_ref: ${{ github.event.release.tag_name || 'devel' }}
          stage: int

      - name: "Pull Archive Results"
        uses: actions/download-artifact@v4
        with:
          name: archive.tar.gz

      - name: "Deploy Soak GDS service"
        uses: moisesmata/fprime-actions/soak-setup@soak-actions-improvements
        with:
          deployment-name: zephyr-reference
          platform: pico2
