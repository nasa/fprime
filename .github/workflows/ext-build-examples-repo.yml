# Builds and runs UTs on https://github.com/fprime-community/fprime-examples

name: "External Repo: fprime-examples"

on:
  
  push:
    branches: [ dp-int-testing, release/** ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ devel, release/** ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - '.github/agents/**'
  workflow_dispatch:
# Cancel in-progress runs if a newer run is started on a given PR
  
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'devel') && !contains(github.ref, 'release/')}}

permissions:
  contents: read

jobs:
  get-branch:
    name: "Get target branch"
    uses: ./.github/workflows/reusable-get-pr-branch.yml
    with:
      target_repository: Specky26846/fprime-examples

  run:
    needs: get-branch
    name: ""
    uses: ./.github/workflows/reusable-project-builder.yml
    with:
      target_repository: Specky26846/fprime-examples
      build_location: FlightExamples
      run_unit_tests: true # unit tests being run through the reusable workflow
      target_ref: ${{ needs.get-branch.outputs.target-branch }}
      fprime_location: ./FlightExamples/lib/fprime

  integration-tests:
    needs: run
    name: "Run Integration Tests"
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout target repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          repository: Specky26846/fprime-examples
          ref: devel
      - name: "Overlay current F´ revision"
        uses: actions/checkout@v4
        with:
          submodules: true
          path: ./FlightExamples/lib/fprime
      - name: "Setup environment"
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install -r ./FlightExamples/lib/fprime/requirements.txt
          echo "${PWD}/venv/bin" >> "${GITHUB_PATH}"
      # Upgrade GDS to a matching pr-xxxx branch if it exists; never fall back to devel
      - name: "Upgrade fprime-gds to pr-xxxx (if it exists)"
        if: github.event_name == 'pull_request'
        uses: nasa/fprime-actions/upgrade-package@devel
        with:
          repository: nasa/fprime-gds
          pr-branch-only: true
      - name: "Download integration test files"
        uses: actions/download-artifact@v8
        with:
          name: aarch64-linux-artifacts
          path: aarch64-linux-artifacts
      - name: "Build native x86_64 binary for integration tests"
        working-directory: FlightExamples
        run: |
          . ../venv/bin/activate
          fprime-util generate
          fprime-util build
      - name: "Run dp_demo integration tests"
        continue-on-error: true
        run: |
          DEPLOYMENT=ExamplesDeployment
          . venv/bin/activate
          mkdir -p ci-logs
          chmod +x ./FlightExamples/build-artifacts/Linux/${DEPLOYMENT}/bin/${DEPLOYMENT}
          fprime-gds --ip-client -d ./FlightExamples/build-artifacts/Linux/${DEPLOYMENT} --logs ./ci-logs &
          sleep 10
          cd aarch64-linux-artifacts/int
          pytest dp_demo_integration_test.py
      - name: "Run Svc integration tests"
        run: |
          DEPLOYMENT=ExamplesDeployment
          . venv/bin/activate
          pkill -f fprime-gds || true
          sleep 2
          cd FlightExamples
          pytest lib/fprime/Svc --dictionary ./build-artifacts/Linux/${DEPLOYMENT}/dict/ExamplesDeploymentTopologyDictionary.json --deployment-config ./ExamplesDeployment/test/int/int_config.json