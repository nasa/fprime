# Builds and runs UTs on https://github.com/fprime-community/fprime-examples

name: "External Repo: fprime-examples"

on:
  
  push:
    branches: [ dp-int-testing, release/** ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ devel, release/** ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - '.github/agents/**'
  workflow_dispatch:
# Cancel in-progress runs if a newer run is started on a given PR
  
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'devel') && !contains(github.ref, 'release/')}}

permissions:
  contents: read

jobs:
  get-branch:
    name: "Get target branch"
    uses: ./.github/workflows/reusable-get-pr-branch.yml
    with:
      target_repository: Specky26846/fprime-examples

  run:
    needs: get-branch
    name: ""
    uses: ./.github/workflows/reusable-project-builder.yml
    with:
      target_repository: Specky26846/fprime-examples
      build_location: FlightExamples
      run_unit_tests: true # unit tests being run through the reusable workflow
      target_ref: ${{ needs.get-branch.outputs.target-branch }}
      fprime_location: ./FlightExamples/lib/fprime

  integration-tests:
    needs: [run, get-branch]
    name: "Run Integration Tests"
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout target repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          repository: Specky26846/fprime-examples
          ref: ${{ needs.get-branch.outputs.target-branch }}
      - name: "Overlay current F´ revision"
        uses: actions/checkout@v4
        with:
          submodules: true
          path: ./FlightExamples/lib/fprime
      - name: "Setup environment"
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install -r ./FlightExamples/lib/fprime/requirements.txt
          echo "${PWD}/venv/bin" >> "${GITHUB_PATH}"
      # Upgrade GDS to a matching pr-xxxx branch if it exists; never fall back to devel
      - name: "Upgrade fprime-gds to pr-xxxx (if it exists)"
        if: github.event_name == 'pull_request'
        uses: nasa/fprime-actions/upgrade-package@devel
        with:
          repository: nasa/fprime-gds
          pr-branch-only: true
      - name: "Download integration test files"
        uses: actions/download-artifact@v8
        with:
          name: aarch64-linux-artifacts
          path: aarch64-linux-artifacts
      - name: "Debug: List downloaded artifacts"
        run: |
          echo "=== Downloaded artifacts structure ==="
          ls -laR aarch64-linux-artifacts/
      - name: "Install build dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
      - name: "Install decaf framing GDS plugin"
        run: |
          . venv/bin/activate
          pip install -e ./GdsExamples/gds-plugins
      - name: "Build native x86_64 binary for integration tests"
        working-directory: FlightExamples/ExamplesDeployment
        run: |
          . ../../venv/bin/activate
          fprime-util purge --force
          fprime-util generate
          fprime-util build -j8
      - name: "Run integration tests"
        continue-on-error: false
        run: |
          DEPLOYMENT=ExamplesDeployment
          . venv/bin/activate

          echo "=== Checking Build Artifacts ==="
          if [ -f "./FlightExamples/build-artifacts/Linux/${DEPLOYMENT}/bin/${DEPLOYMENT}" ]; then
            echo "Binary exists: ${DEPLOYMENT}"
          else
            echo "Binary not found!"
            exit 1
          fi

          if [ -f "./FlightExamples/build-artifacts/Linux/${DEPLOYMENT}/dict/ExamplesDeploymentTopologyDictionary.json" ]; then
            echo "Dictionary exists: ExamplesDeploymentTopologyDictionary.json"

            echo ""
            echo "=== Checking Dictionary for ManagerWorker ==="
            DICT_FILE="./FlightExamples/build-artifacts/Linux/${DEPLOYMENT}/dict/ExamplesDeploymentTopologyDictionary.json"
            MW_CMD_COUNT=$(grep -o '"name"[[:space:]]*:[[:space:]]*"[^"]*ManagerWorker[^"]*"' "$DICT_FILE" | grep -c '"commands"' || echo 0)
            MW_EVT_COUNT=$(grep -c 'ManagerWorker' "$DICT_FILE" || echo 0)
            echo "ManagerWorker references in dictionary: $MW_EVT_COUNT"
            if [ "$MW_EVT_COUNT" -eq 0 ]; then
              echo "WARNING: No ManagerWorker components found in dictionary"
              echo "  Tests may fail if ManagerWorker is required"
            else
              echo "ManagerWorker found in dictionary"
            fi
          else
            echo "Dictionary not found!"
            exit 1
          fi

          chmod +x ./FlightExamples/build-artifacts/Linux/${DEPLOYMENT}/bin/${DEPLOYMENT}
          mkdir -p ci-logs
          cd FlightExamples/${DEPLOYMENT}

          echo ""
          echo "=== Starting GDS ==="
          fprime-gds -d ../build-artifacts/Linux/${DEPLOYMENT} --logs ../../ci-logs --framing-selection decaf &
          sleep 15

          if ps aux | grep fprime-gds | grep -v grep > /dev/null; then
            echo "GDS is running"
          else
            echo "GDS failed to start!"
            exit 1
          fi

          if ps aux | grep ${DEPLOYMENT} | grep -v grep > /dev/null; then
            echo "${DEPLOYMENT} app is running"
          else
            echo "${DEPLOYMENT} app failed to start!"
            exit 1
          fi

          echo ""
          echo "=== Running Integration Tests ==="
          cd ../..
          pytest --dictionary FlightExamples/build-artifacts/Linux/${DEPLOYMENT}/dict/ExamplesDeploymentTopologyDictionary.json \
            --deployment-config FlightExamples/ManagerWorker/Subtopology/test/int/int_config.json \
            -v \
            FlightExamples/ManagerWorker/Subtopology/test/int/test_manager_worker.py || {
            echo ""
            echo "Integration tests failed!"
            echo ""
            echo "=== GDS Logs ==="
            cat ci-logs/*.log 2>/dev/null || echo "No log files found"
            exit 1
          }
          # Archive the outputs
      - name: 'Archive Logs'
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-int-logs
          path: ci-logs/
          retention-days: 5
