# Unit test verification for the F´ Ref deployment.

name: "Ref Unit Tests"

on:
  push:
    branches: [ devel, release/** ]
  pull_request:
    branches: [ devel, release/** ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (e.g. ubuntu-22.04, macos-latest)"
        required: false
        default: ""
      jobs:
        description: "Parallel job count: a number, 'random' (1-32), or empty to omit -j"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'devel') && !contains(github.ref, 'release/') }}

jobs:
  unit-tests:
    name: "Ref UTs (${{ matrix.runner }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            jobs: "random"
          - runner: macos-latest
            jobs: "2"
    timeout-minutes: 30
    runs-on: ${{ github.event.inputs.runner || matrix.runner }}
    steps:
      - name: "Checkout F´ Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: "Setup F´ Tools"
        uses: nasa/fprime-actions/setup@devel
        with:
          location: ${{ github.workspace }}
      - name: "Run Unit Tests"
        uses: nasa/fprime-actions/run-unit-tests@devel
        with:
          working-directory: "Ref"
          generate-args: "-DFPRIME_ENABLE_FRAMEWORK_UTS=OFF"
          jobs: ${{ github.event.inputs.jobs || matrix.jobs }}
