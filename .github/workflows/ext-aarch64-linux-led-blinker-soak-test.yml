# Scheduled soak test for the LedBlinker deployment on AArch64 Linux.
#
# Runs against the persistent services installed by
# ext-aarch64-linux-led-blinker-soak-setup.yml: analyzes captured ComLogger
# telemetry for FATALs and degradation trends, then runs the integration tests.

name: "Soak Test: AArch64 Linux LedBlinker"

on:
  # Uncomment to run periodically (e.g. every 30 minutes):
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Shared with the soak-setup workflow so a test queues behind any in-flight
# setup. cancel-in-progress: false means a second test run waits rather than
# killing the first; setup's own concurrency entry uses true so a release can
# preempt an in-flight test.
concurrency:
  group: ledblinker-soak
  cancel-in-progress: false

jobs:
  soak-test:
    name: "Soak Test"
    runs-on: [self-hosted, ARM64]
    steps:
      - uses: moisesmata/fprime-actions/soak-test@soak-testing-actions
