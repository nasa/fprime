# Scheduled testing of LED blinker system service every 30 minutes
# Connects to running service via GDS and runs integration tests
name: "Soak Test AArch64 Linux: External Repo LedBlinker"

on:
  #schedule:
    # Run every 30 minutes
    #- cron: '*/30 * * * *'
  # Allow manual triggering for testing
  workflow_dispatch:

env:
  SERVICE_NAME: fprime-ledblinker-soak
  INSTALL_DIR: /opt/fprime-ledblinker-soak

jobs:
  scheduled-test:
    name: "Scheduled Integration Test"
    runs-on: [self-hosted, ARM64]
    steps:
      
      - name: "Check service status"
        run: |
          echo "=== Checking current service file contents ==="
          echo "LedBlinker service file:"
          sudo cat /etc/systemd/system/${SERVICE_NAME}.service || true
          echo ""
          echo "GDS service file:"
          sudo cat /etc/systemd/system/${SERVICE_NAME}-gds.service || true
          echo ""
          
          echo "Checking if ${SERVICE_NAME} service is running..."
          if sudo systemctl is-active --quiet ${SERVICE_NAME}; then
            echo "Service ${SERVICE_NAME} is running"
            sudo systemctl status ${SERVICE_NAME} --no-pager -l
          else
            echo "Service ${SERVICE_NAME} is not running"
            sudo systemctl status ${SERVICE_NAME} --no-pager -l
            echo "Recent service logs:"
            sudo journalctl -u ${SERVICE_NAME} --no-pager -n 20
            exit 1
          fi
          
          echo "Checking if ${SERVICE_NAME}-gds service is running..."
          if sudo systemctl is-active --quiet ${SERVICE_NAME}-gds; then
            echo "Service ${SERVICE_NAME}-gds is running"
            sudo systemctl status ${SERVICE_NAME}-gds --no-pager -l
          else
            echo "Service ${SERVICE_NAME}-gds is not running"
            sudo systemctl status ${SERVICE_NAME}-gds --no-pager -l
            echo "Recent GDS service logs:"
            sudo journalctl -u ${SERVICE_NAME}-gds --no-pager -n 20
            exit 1
          fi
          
      - name: "Run integration tests"
        run: |
          # Clear previous logs before running tests
          echo "Clearing previous logs from ${INSTALL_DIR}/logs..."
          sudo rm -rf ${INSTALL_DIR}/logs/*
          
          # Use the virtual environment created during setup
          . ${INSTALL_DIR}/venv/bin/activate
          
          TEST_TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          
          echo "=== Integration test started at $(date) (${TEST_TIMESTAMP}) ==="
          
          # Run the integration test 
          echo "Running integration tests..."
          pytest --dictionary ${INSTALL_DIR}/dict/LedBlinkerTopologyDictionary.json ${INSTALL_DIR}/test/led_integration_tests.py
          
          echo "=== Integration test completed at $(date) (${TEST_TIMESTAMP}) ==="
          
      - name: 'Archive Test Results'
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${INSTALL_DIR}/logs
          retention-days: 5
