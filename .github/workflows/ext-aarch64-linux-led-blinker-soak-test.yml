# Scheduled soak test for the LedBlinker deployment on AArch64 Linux.
#
# Runs against the persistent services installed by
# ext-aarch64-linux-led-blinker-soak-setup.yml: analyzes captured ComLogger
# telemetry for FATALs and degradation trends (if available), then runs the
# integration tests.
#
# TESTING: soak actions point at moisesmata/fprime-actions@soak-testing-actions.
# Switch back to nasa/fprime-actions@devel before opening the PR for review.

name: "Soak Test: AArch64 Linux LedBlinker"

on:
  # Uncomment to run periodically (e.g. every 30 minutes):
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  INSTALL_DIR: /opt/ledblinker-soak

jobs:
  soak-monitoring:
    name: "Soak Log Analysis"
    runs-on: [self-hosted, ARM64]
    steps:
      - name: "Analyze soak telemetry"
        uses: moisesmata/fprime-actions/soak-monitor@soak-testing-actions
        with:
          dictionary: "${{ env.INSTALL_DIR }}/dict/*TopologyDictionary.json"
          com-logs: ${{ env.INSTALL_DIR }}/ComLoggerFiles
          python: ${{ env.INSTALL_DIR }}/venv/bin/python

  integration-test:
    name: "Integration Test"
    runs-on: [self-hosted, ARM64]
    needs: soak-monitoring
    steps:
      - name: "Run integration tests against persistent GDS"
        uses: moisesmata/fprime-actions/soak-integration-test@soak-testing-actions
        with:
          fsw-service: ledblinker-soak-fsw
          venv: ${{ env.INSTALL_DIR }}/venv
          dictionary: "${{ env.INSTALL_DIR }}/dict/*TopologyDictionary.json"
          test-path: ${{ env.INSTALL_DIR }}/test/led_integration_tests.py
          working-directory: ${{ env.INSTALL_DIR }}
