name: "TSan: Lockless Priority Queue"

on:
  push:
    branches: [ devel, release/** ]
  pull_request:
    branches: [ devel, release/** ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'devel') && !contains(github.ref, 'release/') }}

permissions:
  contents: read

jobs:
  tsan-lockless-queue:
    name: "ThreadSanitizer Stress Tests [${{ matrix.os }}]"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, macos-latest ]

    steps:
      - name: "Checkout F Prime Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: "Setup F Prime Tools"
        uses: nasa/fprime-actions/setup@devel
        with:
          location: ${{ github.workspace }}

      - name: "Generate UT Build Cache (TSan)"
        run: |
          fprime-util generate --ut \
            -DENABLE_SANITIZER_THREAD=ON \
            -DENABLE_SANITIZER_ADDRESS=OFF \
            -DENABLE_SANITIZER_LEAK=OFF \
            -DENABLE_SANITIZER_UNDEFINED_BEHAVIOR=OFF \
            -DFPRIME_ENABLE_UT_COVERAGE=OFF

      - name: "Run UTs under ThreadSanitizer"
        env:
          CTEST_OUTPUT_ON_FAILURE: "1"
          TSAN_OPTIONS: "halt_on_error=1 history_size=5"
        run: |
          fprime-util check --all -j4 --pass-through --output-on-failure \
            --timeout 600 -R LocklessPriorityQueueTsanTest
