# Builds external reference projects, tutorials, and cookiecutter templates
# against the current F' revision.
#
# Consolidates the former per-project ext-* workflows into one workflow that
# resolves all target branches in a single job and builds the simple projects
# through a matrix. Reference projects no longer re-run framework unit tests
# (the Framework CI workflow covers those); they build and run their own
# integration tests only.
#
# Scheduling policy:
#   - pull_request: all jobs
#   - nightly cron (2:00 AM Pacific): all jobs (replaces the former push runs)

name: "External References"

on:
  pull_request:
    branches: [ devel, release/** ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - '.github/agents/**'
  schedule:
    - cron: "0 10 * * *"  # 2:00 AM Pacific (PST)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AARCH64_TOOLCHAIN_DIR: /tmp/aarch64-toolchain
  AARCH64_TOOLCHAIN_URL: https://developer.arm.com/-/media/Files/downloads/gnu-a/10.2-2020.11/binrel/gcc-arm-10.2-2020.11-x86_64-aarch64-none-linux-gnu.tar.xz
  ARM_TOOLS_PATH: /tmp/aarch64-toolchain
  RPI_TOOLCHAIN_DIR: /tmp/rpi-toolchain

jobs:
  # Resolve the target branch for every external repository in one job
  # (formerly one reusable-workflow job per external workflow).
  # Priority per repository: pr-<number> branch, then a branch matching the
  # PR base branch, then the repository default.
  get-branches:
    name: "Get target branches"
    runs-on: ubuntu-22.04
    outputs:
      examples: ${{ steps.resolve.outputs.examples }}
      hello-world: ${{ steps.resolve.outputs.hello-world }}
      led-blinker: ${{ steps.resolve.outputs.led-blinker }}
      math-component: ${{ steps.resolve.outputs.math-component }}
      python-reference: ${{ steps.resolve.outputs.python-reference }}
      cfs-reference: ${{ steps.resolve.outputs.cfs-reference }}
      zephyr-reference: ${{ steps.resolve.outputs.zephyr-reference }}
      generic-hub: ${{ steps.resolve.outputs.generic-hub }}
      tools: ${{ steps.resolve.outputs.tools }}
      bootstrap: ${{ steps.resolve.outputs.bootstrap }}
    env:
      PR_NUMBER: ${{ github.event.number }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: "Resolve target branches"
        id: resolve
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          resolve() {
            local key="$1" repo="$2" default_ref="${3:-devel}"
            local target="${default_ref}"
            if [[ "${EVENT_NAME}" == "pull_request" ]]; then
              BRANCH_NAME="${GITHUB_BASE_REF}"
              code_pr=$(curl -s -w '%{response_code}' "https://api.github.com/repos/${repo}/branches/pr-${PR_NUMBER}" -o /dev/null)
              if [[ "${code_pr}" == "200" ]]; then
                target="pr-${PR_NUMBER}"
                echo "${key}: PR branch found, using ${target}"
                echo "${key}=${target}" >> "$GITHUB_OUTPUT"
                return
              fi
            fi
            code_branch=$(curl -s -w '%{response_code}' "https://api.github.com/repos/${repo}/branches/${BRANCH_NAME}" -o /dev/null)
            if [[ "${code_branch}" == "200" ]]; then
              target="${BRANCH_NAME}"
              echo "${key}: base branch found, using ${target}"
            else
              echo "${key}: no matching branch, using ${target}"
            fi
            echo "${key}=${target}" >> "$GITHUB_OUTPUT"
          }
          resolve examples          nasa/fprime-examples
          resolve hello-world      fprime-community/fprime-tutorial-hello-world
          resolve led-blinker      fprime-community/fprime-workshop-led-blinker
          resolve math-component   fprime-community/fprime-tutorial-math-component
          resolve python-reference fprime-community/fprime-python-reference main
          resolve cfs-reference    fprime-community/fprime_cfs_reference
          resolve zephyr-reference fprime-community/fprime-zephyr-reference
          resolve generic-hub      fprime-community/fprime-generic-hub-reference
          resolve tools            nasa/fprime-tools
          resolve bootstrap        fprime-community/fprime-bootstrap

  # -------- Tutorials and examples: build only (framework UTs are covered
  # -------- by the Framework CI workflow) --------
  tutorials:
    name: "Build: ${{ matrix.name }}"
    needs: get-branches
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "HelloWorld"
            target_repository: fprime-community/fprime-tutorial-hello-world
            fprime_location: ./lib/fprime
            build_location: HiNamespace/FirstDeployment
            target_ref: hello-world
          - name: "LedBlinker"
            target_repository: fprime-community/fprime-workshop-led-blinker
            fprime_location: lib/fprime
            build_location: LedBlinker/LedBlinkerDeployment
            target_ref: led-blinker
          - name: "MathComponent"
            target_repository: fprime-community/fprime-tutorial-math-component
            fprime_location: ./lib/fprime
            build_location: MathProject/MathDeployment
            target_ref: math-component
          - name: "fprime-examples"
            target_repository: nasa/fprime-examples
            fprime_location: ./FlightExamples/lib/fprime
            build_location: FlightExamples
            target_ref: examples
    uses: ./.github/workflows/reusable-project-builder.yml
    with:
      target_repository: ${{ matrix.target_repository }}
      fprime_location: ${{ matrix.fprime_location }}
      build_location: ${{ matrix.build_location }}
      run_unit_tests: false # framework UTs are covered by Framework CI
      target_ref: ${{ needs.get-branches.outputs[matrix.target_ref] }}

  examples-integration:
    needs: [tutorials, get-branches]
    name: "Integration Tests: fprime-examples"
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout target repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          repository: nasa/fprime-examples
          ref: ${{ needs.get-branches.outputs.examples }}
      - name: "Overlay current F' revision"
        uses: actions/checkout@v4
        with:
          submodules: true
          path: ./FlightExamples/lib/fprime
      - name: "Setup environment"
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install -r ./FlightExamples/lib/fprime/requirements.txt
          echo "${PWD}/venv/bin" >> "${GITHUB_PATH}"
      # Upgrade GDS to a matching pr-xxxx branch if it exists; never fall back to devel
      - name: "Upgrade fprime-gds to pr-xxxx (if it exists)"
        if: github.event_name == 'pull_request'
        uses: nasa/fprime-actions/upgrade-package@devel
        with:
          repository: nasa/fprime-gds
          pr-branch-only: true
      - name: "Install build dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
      - name: "Install decaf framing GDS plugin"
        run: |
          . venv/bin/activate
          pip install -e ./GdsExamples/gds-plugins
      - name: "Build native x86_64 binary for integration tests"
        working-directory: FlightExamples/ExamplesDeployment
        run: |
          . ../../venv/bin/activate
          fprime-util purge --force
          fprime-util generate
          fprime-util build -j8
      - name: "Run integration tests"
        continue-on-error: false
        run: |
          DEPLOYMENT=ExamplesDeployment
          . venv/bin/activate

          chmod +x ./FlightExamples/build-artifacts/Linux/${DEPLOYMENT}/bin/${DEPLOYMENT}
          mkdir -p ci-logs
          cd FlightExamples/${DEPLOYMENT}
          fprime-gds -d ../build-artifacts/Linux/${DEPLOYMENT} --logs ../../ci-logs --framing-selection decaf &
          sleep 15

          cd ../..
          pytest --dictionary FlightExamples/build-artifacts/Linux/${DEPLOYMENT}/dict/ExamplesDeploymentTopologyDictionary.json \
            --deployment-config FlightExamples/ManagerWorker/Subtopology/test/int/int_config.json \
            --no-zmq \
            -v \
            FlightExamples/ManagerWorker/Subtopology/test/int/test_manager_worker.py
      - name: 'Archive Logs'
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-int-logs
          path: ci-logs/
          retention-days: 5

  # -------- fprime-python-reference --------
  python-reference:
    name: "fprime-python-reference: Build and Integration Tests"
    # ubuntu-24.04 provides Python 3.12, required by fprime-python-reference
    runs-on: ubuntu-24.04
    needs: get-branches
    steps:
      - name: "Set up target repository"
        uses: nasa/fprime-actions/external-repository-setup@devel
        with:
          target_repository: fprime-community/fprime-python-reference
          fprime_location: ./lib/fprime
          target_ref: ${{ needs.get-branches.outputs.python-reference }}
      - name: "Build"
        uses: nasa/fprime-actions/build@devel
        with:
          jobs: "8"
      - name: "Integration Tests"
        uses: nasa/fprime-actions/run-integration-tests@devel
        with:
          gds-working-directory: "."
          test-working-directory: "."
          binary: "python3"
          binary-args: "build-artifacts/python/fsw_main.py"
          gds-args: "--ip-client --dictionary build-artifacts/*/*/dict/ReferenceDeploymentTopologyDictionary.json"
          pytest-args: "test/int --dictionary build-artifacts/*/*/dict/ReferenceDeploymentTopologyDictionary.json --logs gds-logs"
      # Tar the logs first: GDS log filenames contain colons, which upload-artifact rejects
      - name: "Bundle logs"
        if: always()
        run: |
          if [ -d gds-logs ]; then
            tar -czf gds-logs.tar.gz gds-logs
          fi
        shell: bash
      - name: "Archive logs"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fprime-python-reference-logs
          path: gds-logs.tar.gz
          retention-days: 5

  # -------- fprime_cfs_reference --------
  cfs-reference:
    name: "cFS Build and Integration Tests"
    runs-on: ubuntu-22.04
    needs: get-branches
    steps:
      - name: "Make Space"
        uses: nasa/fprime-actions/make-space@devel
      - name: "Set up target repository"
        uses: nasa/fprime-actions/external-repository-setup@devel
        with:
          target_repository: fprime-community/fprime_cfs_reference
          fprime_location: ./libs/fprime
          target_ref: ${{ needs.get-branches.outputs.cfs-reference }}
      # Upgrade GDS to a matching pr-xxxx branch if it exists; never fall back to devel
      - name: "Upgrade fprime-gds to pr-xxxx (if it exists)"
        if: github.event_name == 'pull_request'
        uses: nasa/fprime-actions/upgrade-package@devel
        with:
          repository: nasa/fprime-gds
          pr-branch-only: true
      - name: "Build cFS Reference"
        run: |
          make SIMULATION=native prep
          make
          make install
      - name: "Run Integration Tests"
        uses: nasa/fprime-actions/run-integration-tests@devel
        with:
          gds-working-directory: build-artifacts/exe/cpu1
          test-working-directory: test/int
          binary: ./core-cpu1
          binary-args: ""
          gds-args: >-
            --ip-client --ip-port 15010
            --dictionary ${{ github.workspace }}/build-artifacts/exe/Linux/fprime_app/dict/FPrimeDeploymentTopologyDictionary.json
          pytest-args: >-
            --dictionary ${{ github.workspace }}/build-artifacts/exe/Linux/fprime_app/dict/FPrimeDeploymentTopologyDictionary.json
            --deployment-config ${{ github.workspace }}/test/int/int_config.json
      - name: "Archive logs"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cfs-reference-logs
          path: build-artifacts/exe/cpu1/gds-logs
          retention-days: 5

  # -------- fprime-zephyr-reference cross-compiles --------
  zephyr:
    name: "Zephyr Build: ${{ matrix.board }}"
    needs: get-branches
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: "Pico 2"
            ci_config_file: ./lib/fprime-zephyr/ci/sample-configs/pico2.yml
          - board: "Teensy 4.1"
            ci_config_file: ./lib/fprime-zephyr/ci/sample-configs/teensy41.yml
    uses: ./.github/workflows/reusable-project-ci.yml
    with:
      target_repository: fprime-community/fprime-zephyr-reference
      target_ref: ${{ needs.get-branches.outputs.zephyr-reference }}
      ci_config_file: ${{ matrix.ci_config_file }}

  # -------- fprime-generic-hub-reference --------
  generic-hub:
    name: "Generic Hub round-trip"
    runs-on: ubuntu-22.04
    needs: get-branches
    steps:
      - name: "Checkout target repository"
        uses: actions/checkout@v4
        with:
          repository: fprime-community/fprime-generic-hub-reference
          ref: ${{ needs.get-branches.outputs.generic-hub }}
          submodules: recursive

      - name: "Overlay current F' revision"
        uses: actions/checkout@v4
        with:
          path: lib/fprime
          submodules: true
          fetch-depth: 0

      - name: "Setup F' toolchain"
        uses: ./lib/fprime/.github/actions/setup
        with:
          location: lib/fprime

      # Upgrade GDS to a matching pr-xxxx branch if it exists; never fall back to devel
      - name: "Upgrade fprime-gds to pr-xxxx (if it exists)"
        if: github.event_name == 'pull_request'
        uses: nasa/fprime-actions/upgrade-package@devel
        with:
          repository: nasa/fprime-gds
          pr-branch-only: true

      - name: "Generate"
        run: fprime-util generate

      - name: "Build"
        run: fprime-util build -j8

      - name: "Set up runtime config variables"
        shell: bash
        run: |
          set -Eeuo pipefail

          BUILD_DIR="${GITHUB_WORKSPACE}/build-artifacts/Linux"
          A_DIR="${BUILD_DIR}/FprimeGenericHubReference_Deployments_DeploymentA"
          B_BIN="${BUILD_DIR}/FprimeGenericHubReference_Deployments_DeploymentB/bin/FprimeGenericHubReference_Deployments_DeploymentB"
          A_DICT="${A_DIR}/dict/DeploymentATopologyDictionary.json"
          A_TEST_DIR="${GITHUB_WORKSPACE}/FprimeGenericHubReference/Deployments/DeploymentA/test/int"
          A_TEST_CONFIG="${A_TEST_DIR}/int_config.json"
          LOG_DIR="${GITHUB_WORKSPACE}/hub-communication-logs"
          B_LOG="${LOG_DIR}/deploymentB.stdout.log"
          GDS_LOG="${LOG_DIR}/gds.stdout.log"
          GDS_LOG_DIR="${LOG_DIR}/gds"
          PORT_A=50000
          PORT_B=50001

          # Resolve the HubCommandTest opcode from the dictionary instead of hardcoding it.
          # F' renders opcodes in the console as lowercase, unpadded hex, e.g. 0x11017500.
          CMD_OPCODE="$(jq -r '.commands[] | select(.name | endswith(".HubCommandTest")) | .opcode' "${A_DICT}")"
          if [[ -z "${CMD_OPCODE}" || "${CMD_OPCODE}" == "null" ]]; then
            echo "Could not resolve HubCommandTest opcode from ${A_DICT}" >&2
            exit 1
          fi
          # Convert the dictionary's decimal opcode to the console's lowercase hexadecimal format.
          CMD_OPCODE_HEX="$(printf '0x%x' "${CMD_OPCODE}")"
          echo "HubCommandTest opcode: ${CMD_OPCODE_HEX}"

          {
            echo "A_DIR=${A_DIR}"
            echo "B_BIN=${B_BIN}"
            echo "A_DICT=${A_DICT}"
            echo "A_TEST_DIR=${A_TEST_DIR}"
            echo "A_TEST_CONFIG=${A_TEST_CONFIG}"
            echo "LOG_DIR=${LOG_DIR}"
            echo "B_LOG=${B_LOG}"
            echo "GDS_LOG=${GDS_LOG}"
            echo "GDS_LOG_DIR=${GDS_LOG_DIR}"
            echo "PORT_A=${PORT_A}"
            echo "PORT_B=${PORT_B}"
            echo "CMD_OPCODE=${CMD_OPCODE}"
            echo "CMD_OPCODE_HEX=${CMD_OPCODE_HEX}"
          } >> "${GITHUB_ENV}"

      - name: "Run Generic Hub round-trip"
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "${LOG_DIR}"

          echo "Starting DeploymentB on TCP port ${PORT_B}"
          # stdbuf line-buffers B's output so its logs are ensured to be on disk when we grep below
          stdbuf -oL -eL "${B_BIN}" -a 127.0.0.1 -p "${PORT_B}" >"${B_LOG}" 2>&1 &

          echo "Starting DeploymentA through GDS on TCP port ${PORT_A}"
          mkdir -p "${GDS_LOG_DIR}"
          fprime-gds \
            --ip-client \
            --ip-address 127.0.0.1 \
            --ip-port "${PORT_A}" \
            -d "${A_DIR}" \
            --dictionary "${A_DICT}" \
            -g none \
            --logs "${GDS_LOG_DIR}" \
            --log-to-stdout \
            >"${GDS_LOG}" 2>&1 &

          # Wait for GDS to connect DeploymentA before pytest
          a_timeout=$((SECONDS + 60))
          until grep -q "tcp_handler: Client connected" "${GDS_LOG}"; do
            (( SECONDS < a_timeout )) || {
              echo "DeploymentA/GDS did not establish its TCP connection before timeout" >&2
              exit 1
            }
            sleep 1
          done

          # Exercise message paths and verify return events through pytest.
          pytest "${A_TEST_DIR}" \
            --dictionary "${A_DICT}" \
            --deployment-config "${A_TEST_CONFIG}" \
            --logs "${GDS_LOG_DIR}"

      - name: "Verify HubCommandTest on DeploymentB"
        shell: bash
        run: |
          # Verify in DeploymentB's logs that the commands have been dispatched
          # this is a current limitation - FprimeRouter::cmdResponseIn_handler
          # is a no-op that discards the hub-returned command response

          set -Eeuo pipefail
          sleep 1

          if ! grep -q "OpCodeDispatched : Opcode ${CMD_OPCODE_HEX} dispatched" "${B_LOG}"; then
            echo "DeploymentB did not dispatch HubCommandTest opcode ${CMD_OPCODE_HEX}" >&2
            exit 1
          fi
          if ! grep -q "HubCommandTestEvr" "${B_LOG}"; then
            echo "DeploymentB did not log HubCommandTestEvr" >&2
            exit 1
          fi
          if ! grep -q "OpCodeCompleted : Opcode ${CMD_OPCODE_HEX} completed" "${B_LOG}"; then
            echo "DeploymentB did not complete HubCommandTest opcode ${CMD_OPCODE_HEX}" >&2
            exit 1
          fi

          echo "Generic Hub round-trip assertions passed"

      - name: "Archive Generic Hub logs"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generic-hub-reference-logs
          path: |
            hub-communication-logs
            !hub-communication-logs/gds/**/TestLog_*.xlsx
          if-no-files-found: warn
          retention-days: 5

  # -------- YAMCS reference: build + test in one job (shares setup) --------
  yamcs:
    name: "YAMCS Reference"
    runs-on: ubuntu-22.04
    env:
      DEPLOYMENT: FprimeYamcsReference_YamcsDeployment
    steps:
      - name: "Setup external repository + overlay F'"
        uses: nasa/fprime-actions/external-repository-setup@devel
        with:
          target_repository: fprime-community/fprime-yamcs-reference
          target_ref: main

      - name: "Build deployment"
        run: |
          cd FprimeYamcsReference/YamcsDeployment
          fprime-util generate
          fprime-util build

      - name: "Setup Java 17 for YAMCS"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Setup Python environment"
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "yamcs-client<2.0.0"
          pip install "fprime-gds==4.2.2a4"
          pip install "fprime-xtce>=0.1.3"
          pip install "fprime-yamcs>=0.1.4"

      - name: "Prepare deployment"
        run: |
          chmod +x ./build-artifacts/Linux/${DEPLOYMENT}/bin/${DEPLOYMENT}
          mkdir -p ci-logs

      - name: "Start F' deployment with YAMCS"
        run: |
          fprime-yamcs --ip-client \
            -d ${PWD}/build-artifacts/Linux/${DEPLOYMENT} \
            --logs ${PWD}/ci-logs &
          sleep 15
          if ! jobs -r | grep -q fprime-yamcs; then
            echo "ERROR: YAMCS failed to start"
            cat ${PWD}/ci-logs/*.log 2>/dev/null || true
            exit 1
          fi
          for i in {1..30}; do
            python -c "from yamcs.client import YamcsClient; YamcsClient('127.0.0.1:8090')" 2>/dev/null && { echo "YAMCS ready"; sleep 5; exit 0; }
            sleep 2
          done
          echo "YAMCS timeout" && exit 1

      - name: "Run YAMCS-specific tests"
        run: |
          rc=0
          pytest --dictionary ./build-artifacts/Linux/${DEPLOYMENT}/dict/YamcsDeploymentTopologyDictionary.json \
            --deployment-config ./FprimeYamcsReference/YamcsDeployment/test/int/int_config.json \
            --use-yamcs \
            -v \
            ./FprimeYamcsReference/YamcsDeployment/test/int/test_yamcs_file_transfer.py || rc=1
          exit $rc

      - name: "Run standard Svc integration tests from lib/fprime"
        run: |
          pytest --dictionary ./build-artifacts/Linux/${DEPLOYMENT}/dict/YamcsDeploymentTopologyDictionary.json \
            --deployment-config ./FprimeYamcsReference/YamcsDeployment/test/int/int_config.json \
            --use-yamcs \
            -v \
            ./lib/fprime/Svc/PrmDb/test/int/test_cmd_PrmDb.py \
            ./lib/fprime/Svc/CmdDispatcher/test/int/test_cmd_dispatcher.py \
            ./lib/fprime/Svc/DpCatalog/test/int/test_cmd_dpCatalog.py \
            ./lib/fprime/Svc/DpManager/test/int/test_cmd_dpMgr.py \
            ./lib/fprime/Svc/DpWriter/test/int/test_cmd_dpWriter.py \
            ./lib/fprime/Svc/EventManager/test/int/test_cmd_eventManager.py \
            ./lib/fprime/Svc/FileDownlink/test/int/test_cmd_fileDownlink.py \
            ./lib/fprime/Svc/FileManager/test/int/test_cmd_fileManager.py \
            ./lib/fprime/Svc/SystemResources/test/int/test_cmd_systemResources.py \
            ./lib/fprime/Svc/CmdSequencer/test/int/test_cmd_sequencer.py \
            ./lib/fprime/Svc/FileUplink/test/int/test_cmd_uplink.py \
            ./lib/fprime/Svc/Subtopologies/CdhCore/test/int/test_cdh_core.py \
            ./lib/fprime/Svc/Subtopologies/FileHandling/test/int/test_file_handling.py \
            ./lib/fprime/Svc/Version/test/int/test_cmd_version.py \
            ./lib/fprime/Svc/Health/test/int/test_cmd_health.py

      - name: "Archive test logs"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-logs
          path: ci-logs
          retention-days: 5

  # -------- AArch64 Linux LedBlinker cross-compile + on-target tests --------
  aarch64-cross-compilation:
    name: "AArch64 Cross Compilation"
    runs-on: ubuntu-22.04
    needs: get-branches
    env:
      FPRIME_LOCATION: ./lib/fprime
    steps:
      - name: "Checkout target repository"
        uses: actions/checkout@v4
        with:
          submodules: false
          repository: fprime-community/fprime-workshop-led-blinker
          ref: ${{ needs.get-branches.outputs.led-blinker }}
      - name: "Overlay current F' revision"
        uses: actions/checkout@v4
        with:
          submodules: true
          path: ${{ env.FPRIME_LOCATION }}
          fetch-depth: 0
      - uses: ./lib/fprime/.github/actions/setup
        with:
          location: ${{ env.FPRIME_LOCATION }}
      - name: "Download and Setup AArch64 Linux Toolchain"
        run: |
          mkdir -p ${AARCH64_TOOLCHAIN_DIR}
          wget -q ${AARCH64_TOOLCHAIN_URL}
          tar -xf $(basename ${AARCH64_TOOLCHAIN_URL}) -C ${AARCH64_TOOLCHAIN_DIR} --strip-components 1
          echo "${AARCH64_TOOLCHAIN_DIR}/bin" >> $GITHUB_PATH
      - name: "Generate AArch64 Linux Build Cache"
        run: |
          fprime-util generate aarch64-linux
      - name: "Build AArch64 Linux"
        run: |
          fprime-util build aarch64-linux
      - name: "Prepare artifacts"
        run: |
          mkdir -p aarch64-linux-artifacts
          cp -r ./build-artifacts aarch64-linux-artifacts
          cp -r LedBlinker/Components/Led/test/int aarch64-linux-artifacts
      - name: "Archive Build Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-linux-artifacts
          path: aarch64-linux-artifacts
          retention-days: 5

  aarch64-integration:
    name: "AArch64 Linux Integration Tests"
    runs-on: [self-hosted, aarch64-linux]
    needs: aarch64-cross-compilation
    steps:
      - name: "Checkout F' Repository"
        uses: actions/checkout@v4
        with:
          sparse-checkout: "requirements.txt"
          sparse-checkout-cone-mode: false
      - name: "Setup environment"
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install -r requirements.txt
          echo "${PWD}/venv/bin" >> "${GITHUB_PATH}"
      # Upgrade GDS to a matching pr-xxxx branch if it exists; never fall back to devel
      - name: "Upgrade fprime-gds to pr-xxxx (if it exists)"
        if: github.event_name == 'pull_request'
        uses: nasa/fprime-actions/upgrade-package@devel
        with:
          repository: nasa/fprime-gds
          pr-branch-only: true
      - name: "Artifacts Download"
        uses: actions/download-artifact@v8
        with:
          name: aarch64-linux-artifacts
      - name: Run Integration Tests
        run: |
          DEPLOYMENT=LedBlinker_LedBlinkerDeployment
          . venv/bin/activate
          mkdir -p ci-logs
          chmod +x ./build-artifacts/aarch64-linux/${DEPLOYMENT}/bin/${DEPLOYMENT}
          fprime-gds --ip-client -d ./build-artifacts/aarch64-linux/${DEPLOYMENT} --logs ./ci-logs &
          sleep 10
          pytest --dictionary ./build-artifacts/aarch64-linux/${DEPLOYMENT}/dict/LedBlinkerDeploymentTopologyDictionary.json ./int/led_integration_tests.py
      - name: "Archive logs"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aarch64-linux-logs
          path: ci-logs
          retention-days: 5

  # -------- Raspberry Pi LedBlinker cross-compile + on-target tests --------
  rpi-cross-compilation:
    name: "RPI Cross Compilation"
    runs-on: ubuntu-22.04
    needs: get-branches
    env:
      FPRIME_LOCATION: ./lib/fprime
    steps:
      - name: "Checkout target repository"
        uses: actions/checkout@v4
        with:
          submodules: false
          repository: fprime-community/fprime-workshop-led-blinker
          ref: ${{ needs.get-branches.outputs.led-blinker }}
      - name: "Overlay current F' revision"
        uses: actions/checkout@v4
        with:
          submodules: true
          path: ${{ env.FPRIME_LOCATION }}
          fetch-depth: 0
      - uses: ./lib/fprime/.github/actions/setup
        with:
          location: ${{ env.FPRIME_LOCATION }}
      - name: "Setup RPI Toolchain"
        uses: fprime-community/setup-rpi-sysroot@main
      - name: "Generate RPI Build Cache"
        run: |
          fprime-util generate raspberrypi
      - name: "Build RPI"
        run: |
          cd LedBlinker/LedBlinkerDeployment
          fprime-util build raspberrypi
      - name: "Prepare artifacts"
        run: |
          mkdir -p rpi-artifacts
          cp -r ./build-artifacts rpi-artifacts
          cp -r LedBlinker/Components/Led/test/int rpi-artifacts
      - name: "Archive Build Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: rpi-artifacts
          path: rpi-artifacts
          retention-days: 5

  rpi-integration:
    name: "RPI Integration Tests"
    runs-on: [self-hosted, raspberrypi]
    needs: rpi-cross-compilation
    steps:
      - name: "Checkout F' Repository"
        uses: actions/checkout@v4
        with:
          sparse-checkout: "requirements.txt"
          sparse-checkout-cone-mode: false
      - name: "Setup environment"
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          echo "${PWD}/venv/bin" >> "${GITHUB_PATH}"
      # Upgrade GDS to a matching pr-xxxx branch if it exists; never fall back to devel
      - name: "Upgrade fprime-gds to pr-xxxx (if it exists)"
        if: github.event_name == 'pull_request'
        uses: nasa/fprime-actions/upgrade-package@devel
        with:
          repository: nasa/fprime-gds
          pr-branch-only: true
      - name: "Artifacts Download"
        uses: actions/download-artifact@v8
        with:
          name: rpi-artifacts
      - name: Run Integration Tests
        run: |
          DEPLOYMENT=LedBlinker_LedBlinkerDeployment
          . venv/bin/activate
          mkdir -p ci-logs
          chmod +x ./build-artifacts/raspberrypi/${DEPLOYMENT}/bin/${DEPLOYMENT}
          fprime-gds --ip-client -d ./build-artifacts/raspberrypi/${DEPLOYMENT} --logs ./ci-logs &
          sleep 10
          pytest --dictionary ./build-artifacts/raspberrypi/${DEPLOYMENT}/dict/LedBlinkerDeploymentTopologyDictionary.json ./int/led_integration_tests.py
      - name: "Archive logs"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rpi-logs
          path: ci-logs
          retention-days: 5

  # -------- Cookiecutter template validation --------
  # This job tests the project bootstrapping and cookiecutter templates by
  # creating a new project, deployment and component and building them.
  # This uses the `expect` utility to feed input into the cookiecutter prompts.
  cookiecutters:
    name: "Cookiecutters Validate"
    runs-on: ubuntu-latest
    needs: get-branches
    env:
      BOOTSTRAP_BRANCH: ${{ needs.get-branches.outputs.bootstrap }}
      TOOLS_BRANCH: ${{ needs.get-branches.outputs.tools }}
    steps:
      # Checkout only the bootstrap.expect file, since the full F' repo will be
      # checked out as part of the fprime-bootstrap process
      - name: "Retrieve bootstrap.expect file"
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/cookiecutter-check/bootstrap.expect
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install expect and fprime-bootstrap"
        run: |
             sudo apt-get update
             sudo apt-get install expect
             pip install git+https://github.com/fprime-community/fprime-bootstrap@${BOOTSTRAP_BRANCH}

      - name: "Bootstrap Project"
        run: |
             expect .github/actions/cookiecutter-check/bootstrap.expect

      # Overlay fprime@current_rev in new project so that we build with it in the tests
      # current_rev is devel on the devel branch and the PR revision in PR checks
      - name: "Overlay fprime@current_rev in new project"
        uses: actions/checkout@v4
        with:
          submodules: true
          path: ./my-project/lib/fprime
          fetch-depth: 0

      - name: "Update dependencies and install fprime-tools"
        run: |
             cd my-project
             . fprime-venv/bin/activate
             pip install -U -r ./requirements.txt
             pip install git+https://github.com/nasa/fprime-tools@${TOOLS_BRANCH}

      - name: "Version Check"
        run: |
             cd my-project
             . fprime-venv/bin/activate
             fprime-util version-check

      - name: "Test Generate and Build Project"
        run: |
             cd my-project
             . fprime-venv/bin/activate
             fprime-util generate
             fprime-util build -j4

      - name: "Test New Deployment and Build"
        run: |
             cd my-project
             . fprime-venv/bin/activate
             cd MyProject
             expect ../lib/fprime/.github/actions/cookiecutter-check/deployment.expect
             cd MyDeployment
             fprime-util build -j4

      - name: "Test New Component and Build"
        run: |
             cd my-project
             . fprime-venv/bin/activate
             cd MyProject
             expect ../lib/fprime/.github/actions/cookiecutter-check/component.expect
             cd MyComponent
             fprime-util build -j4
