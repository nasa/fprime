# Builds and runs integration tests on https://github.com/yvijay99/fprime-yamcs-reference

name: "External Repo: YAMCS Reference"

on:
  push:
    branches: [ devel, release/** ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ devel, release/** ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/agents/**'
  workflow_dispatch:

# Cancel in-progress runs if a newer run is started on a given PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'devel') && !contains(github.ref, 'release/')}}

permissions:
  contents: read

jobs:
  build-and-test:
    name: "Build and Test"
    runs-on: ubuntu-22.04
    env:
      DEPLOYMENT: FprimeYamcsReference_YamcsDeployment
    steps:
      - name: "Setup external repository + overlay F´"
        uses: nasa/fprime-actions/external-repository-setup@devel
        with:
          target_repository: yvijay99/fprime-yamcs-reference
          target_ref: testingyamcsclient

      - name: "Build deployment"
        run: |
          cd FprimeYamcsReference/YamcsDeployment
          fprime-util generate
          fprime-util build

      - name: "Debug: List build output"
        run: |
          echo "Current directory:"
          pwd
          echo "Contents:"
          ls -la
          echo "Build directories:"
          find . -type d -name "build*" -o -name "FprimeYamcsReference*" | head -20
          echo "Looking for binary:"
          find . -name "FprimeYamcsReference_YamcsDeployment" -type f 2>/dev/null || echo "Binary not found"

      - name: "Setup Java 17 for YAMCS"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Setup Python environment"
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "yamcs-client<2.0.0"
          pip install "fprime-gds>=4.2.2a3"
          pip install "fprime-yamcs>=0.1.4"

      - name: "Prepare deployment"
        run: |
          chmod +x FprimeYamcsReference/YamcsDeployment/build-fprime-automatic-native/FprimeYamcsReference/YamcsDeployment/bin/${DEPLOYMENT}
          mkdir -p ci-logs

      - name: "Start F´ deployment with YAMCS"
        run: |
          fprime-yamcs --ip-client \
            -d ${PWD}/FprimeYamcsReference/YamcsDeployment \
            --logs ${PWD}/ci-logs &
          sleep 15
          if ! jobs -r | grep -q fprime-yamcs; then
            echo "ERROR: YAMCS failed to start"
            cat ${PWD}/ci-logs/*.log 2>/dev/null || true
            exit 1
          fi

      - name: "Run integration tests"
        run: |
          pytest --dictionary ./FprimeYamcsReference/YamcsDeployment/build-fprime-automatic-native/FprimeYamcsReference/YamcsDeployment/dict/YamcsDeploymentTopologyDictionary.json \
            --deployment-config ./FprimeYamcsReference/YamcsDeployment/test/int/int_config.json \
            --use-yamcs \
            -v \
            ./FprimeYamcsReference/YamcsDeployment/test/int/

      - name: "Archive test logs"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-logs
          path: ci-logs
          retention-days: 5
