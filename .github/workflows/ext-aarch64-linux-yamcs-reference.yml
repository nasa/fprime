# Builds and runs integration tests on https://github.com/yvijay99/fprime-yamcs-reference

name: "External Repo: YAMCS Reference"

on:
  push:
    branches: [ devel, release/** ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ devel, release/** ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/agents/**'

# Cancel in-progress runs if a newer run is started on a given PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'devel') && !contains(github.ref, 'release/')}}

permissions:
  contents: read

jobs:
  get-branch:
    name: "Get target branch"
    uses: ./.github/workflows/reusable-get-pr-branch.yml
    with:
      target_repository: yvijay99/fprime-yamcs-reference

  build:
    needs: get-branch
    name: "Build"
    uses: ./.github/workflows/reusable-project-builder.yml
    with:
      target_repository: yvijay99/fprime-yamcs-reference
      fprime_location: ./lib/fprime
      build_location: FprimeYamcsReference/YamcsDeployment
      run_unit_tests: false
      target_ref: ${{ needs.get-branch.outputs.target-branch }}

  integration-tests:
    name: "Integration Tests"
    runs-on: ubuntu-22.04
    needs: build
    env:
      DEPLOYMENT: FprimeYamcsReference_YamcsDeployment
    steps:
      - name: "Checkout external repository"
        uses: actions/checkout@v4
        with:
          repository: yvijay99/fprime-yamcs-reference
          ref: testingyamcsclient

      - name: "Download build artifacts"
        uses: actions/download-artifact@v8

      - name: "Setup Java 17 for YAMCS"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Setup Python environment"
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "yamcs-client<2.0.0" "fprime-gds>=4.2.2a3" "fprime-yamcs>=0.1.4"

      - name: "Prepare deployment"
        run: |
          chmod +x ./build-artifacts/${DEPLOYMENT}/bin/${DEPLOYMENT}
          mkdir -p ci-logs

      - name: "Start F´ deployment with YAMCS"
        run: |
          ls -la ./build-artifacts/${DEPLOYMENT}/dict/ || true
          fprime-yamcs --ip-client \
            -d ${PWD}/build-artifacts/${DEPLOYMENT} \
            --logs ${PWD}/ci-logs &
          sleep 15
          if ! jobs -r | grep -q fprime-yamcs; then
            echo "ERROR: YAMCS failed to start"
            cat ${PWD}/ci-logs/*.log 2>/dev/null || true
            exit 1
          fi

      - name: "Run YAMCS integration tests"
        run: |
          python -m pytest \
            --dictionary ./build-artifacts/${DEPLOYMENT}/dict/YamcsDeploymentTopologyDictionary.json \
            --deployment-config ./FprimeYamcsReference/YamcsDeployment/test/int/int_config.json \
            --use-yamcs \
            -v \
            ./FprimeYamcsReference/YamcsDeployment/test/int/test_yamcs_file_transfer.py

      - name: "Archive test logs"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-logs
          path: ci-logs
          retention-days: 5
