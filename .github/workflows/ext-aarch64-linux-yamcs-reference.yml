# Cross-compile https://github.com/yvijay99/fprime-yamcs-reference
# Runs integration tests on aarch64-linux

name: "External Repo: AArch64 Linux Yamcs Reference"

on:
  push:
    branches: [devel]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-compilation:
    name: "Cross Compilation"
    runs-on: ubuntu-22.04
    steps:
      - name: "Setup external repository + overlay F´"
        uses: nasa/fprime-actions/external-repository-setup@devel
        with:
          target_repository: yvijay99/fprime-yamcs-reference
          target_ref: testingyamcsclient
      - name: "Cross compile"
        uses: nasa/fprime-actions/build-with-aarch64-toolchain@devel
      - name: "Prepare artifacts"
        run: |
          mkdir -p aarch64-linux-artifacts
          cp -r ./build-artifacts aarch64-linux-artifacts
          cp -r FprimeYamcsReference/YamcsDeployment/test/int aarch64-linux-artifacts
          # Copy fprime Svc integration tests (including conftest.py)
          cp -r lib/fprime/Svc aarch64-linux-artifacts/fprime-svc
      - name: "Archive Build Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-linux-artifacts
          path: aarch64-linux-artifacts
          retention-days: 5

  aarch64-integration:
    name: "AArch64 Linux Integration Tests"
    runs-on: ubuntu-22.04-arm
    needs: cross-compilation
    env:
      DEPLOYMENT: FprimeYamcsReference_YamcsDeployment
    steps:
      - name: "Checkout F´ Repository"
        uses: actions/checkout@v4
        with:
          sparse-checkout: "requirements.txt"
          sparse-checkout-cone-mode: false

      - name: "Download build artifacts"
        uses: actions/download-artifact@v8
        with:
          name: aarch64-linux-artifacts

      - name: "Setup Java 17 for YAMCS"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Setup Python environment"
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "yamcs-client<2.0.0"
          # Install fprime-gds from yamcsPOC branch
          pip install "git+https://github.com/yvijay99/fprime-gds.git@yamcsPOC"
          # Install fprime-yamcs from yamcsPOC branch
          pip install "git+https://github.com/yvijay99/fprime-gds.git@yamcsPOC#subdirectory=src/fprime_gds/executables/fprime_yamcs"
        
      - name: "Prepare deployment"
        run: |
          chmod +x ./build-artifacts/aarch64-linux/${DEPLOYMENT}/bin/${DEPLOYMENT}
          mkdir -p ci-logs

      - name: "Start F´ deployment with YAMCS"
        run: |
          # Verify dictionary exists
          ls -la ./build-artifacts/aarch64-linux/${DEPLOYMENT}/dict/ || true

          fprime-yamcs --ip-client \
            -d ${PWD}/build-artifacts/aarch64-linux/${DEPLOYMENT} \
            --logs ${PWD}/ci-logs &
          sleep 15
          # Check if YAMCS started successfully
          if ! jobs -r | grep -q fprime-yamcs; then
            echo "ERROR: YAMCS failed to start"
            cat ${PWD}/ci-logs/*.log 2>/dev/null || true
            exit 1
          fi

      - name: "Run YAMCS-specific tests"
        run: |
          rc=0
          # YAMCS file transfer tests first, against an idle fileManager
          pytest --dictionary ./build-artifacts/aarch64-linux/${DEPLOYMENT}/dict/YamcsDeploymentTopologyDictionary.json \
            --deployment-config ./int/int_config.json \
            --use-yamcs \
            -v \
            ./int/test_yamcs_file_transfer.py || rc=1
          # Remaining deployment tests; health runs last in its own step
          pytest --dictionary ./build-artifacts/aarch64-linux/${DEPLOYMENT}/dict/YamcsDeploymentTopologyDictionary.json \
            --deployment-config ./int/int_config.json \
            --use-yamcs \
            -v \
            --ignore=./int/test_yamcs_file_transfer.py \
            --ignore=./int/test_cmd_health.py \
            ./int/ || rc=1
          exit $rc

      - name: "Run standard Svc integration tests from lib/fprime"
        run: |
          pytest --dictionary ./build-artifacts/aarch64-linux/${DEPLOYMENT}/dict/YamcsDeploymentTopologyDictionary.json \
            --deployment-config ./int/int_config.json \
            --use-yamcs \
            -v \
            ./fprime-svc/PrmDb/test/int/test_cmd_PrmDb.py \
            ./fprime-svc/CmdDispatcher/test/int/test_cmd_dispatcher.py \
            ./fprime-svc/DpCatalog/test/int/test_cmd_dpCatalog.py \
            ./fprime-svc/DpManager/test/int/test_cmd_dpMgr.py \
            ./fprime-svc/DpWriter/test/int/test_cmd_dpWriter.py \
            ./fprime-svc/EventManager/test/int/test_cmd_eventManager.py \
            ./fprime-svc/FileDownlink/test/int/test_cmd_fileDownlink.py \
            ./fprime-svc/FileManager/test/int/test_cmd_fileManager.py \
            ./fprime-svc/SystemResources/test/int/test_cmd_systemResources.py

      - name: "Run health integration test (last)"
        run: |
          pytest --dictionary ./build-artifacts/aarch64-linux/${DEPLOYMENT}/dict/YamcsDeploymentTopologyDictionary.json \
            --deployment-config ./int/int_config.json \
            --use-yamcs \
            -v \
            ./int/test_cmd_health.py

      - name: "Archive test logs"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-logs
          path: ci-logs
          retention-days: 5
