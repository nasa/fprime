name: ext-ci

on:
  # PR path: fires after ext-ci-trigger completed, i.e. after GitHub's own approval gate.
  # The workflow file and the checked-out scripts come from the default branch, never from the PR.
  workflow_run:
    workflows: [ ext-ci-trigger ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated manifest ids to run, or 'all'"
        type: string
        default: all
      pr_number:
        description: "PR to test and report on (takes precedence over fprime_ref)"
        type: string
        default: ""
      fprime_ref:
        description: "Branch/SHA to test when no PR is given (default: the branch this run was started from)"
        type: string
        default: ""

# One orchestrator per F´ head (repo + branch); a newer PR push cancels the older PR fan-out and
# the finalize step below propagates that to the remote runs. Manual runs are never cancelled.
concurrency:
  group: ext-ci-${{ github.event_name }}-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || inputs.pr_number || inputs.fprime_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

permissions:
  contents: read        # manifest + script
  checks: write         # per-repo Check Runs

jobs:
  orchestrate:
    name: "Orchestrate"
    # Only chain from a trigger that actually ran (not skipped/cancelled) for a PR or merge group.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && contains(fromJSON('["pull_request","merge_group"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    timeout-minutes: 60  # > 2 * max manifest timeout_minutes (queue + run) + overhead
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: "Dispatch, poll and report"
        env:
          DISPATCH_TOKEN: ${{ secrets.EXT_CI_DISPATCH_TOKEN }}  # external repos only; not exposed to other steps
          INPUT_REPOS: ${{ inputs.repos }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_FPRIME_REF: ${{ inputs.fprime_ref }}
          POLL_INTERVAL_SECONDS: 60
        run: python3 .github/actions/ext-ci/orchestrator.py run
      - name: "Finalize (close open checks, cancel orphaned remote runs)"
        if: always()
        env:
          DISPATCH_TOKEN: ${{ secrets.EXT_CI_DISPATCH_TOKEN }}  # external repos only; not exposed to other steps
          JOB_STATUS: ${{ job.status }}
        run: python3 .github/actions/ext-ci/orchestrator.py finalize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ext-ci-results-attempt-${{ github.run_attempt }}
          path: |
            ext-ci-results.json
            ext-ci-state.json
          if-no-files-found: ignore
