# Cross-compile https://github.com/fprime-community/fprime-workshop-led-blinker as system service on AArch64 Linux
# Builds on release publication, stops old service, starts new service
name: "Soak Test Setup AArch64 Linux: External Repo LedBlinker"

on:
  release: 
    types: [published]
  workflow_dispatch:
    #parameters needed to specify which release?

# New releases cancel running deployments
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  AARCH64_TOOLCHAIN_DIR: /tmp/aarch64-toolchain
  AARCH64_TOOLCHAIN_URL: https://developer.arm.com/-/media/Files/downloads/gnu-a/10.2-2020.11/binrel/gcc-arm-10.2-2020.11-x86_64-aarch64-none-linux-gnu.tar.xz
  SERVICE_NAME: fprime-ledblinker-soak
  INSTALL_DIR: /opt/fprime-ledblinker-soak

jobs:
  get-branch:
    name: "Get target branch"
    uses: ./.github/workflows/reusable-get-pr-branch.yml
    with:
      target_repository: fprime-community/fprime-workshop-led-blinker

  cross-compilation:
    name: "Cross Compilation"
    runs-on: ubuntu-22.04
    needs: get-branch
    steps:
      - name: "Checkout target repository"
        uses: actions/checkout@v4
        with:
          submodules: false
          repository: fprime-community/fprime-workshop-led-blinker
          ref: ${{ needs.get-branch.outputs.target-branch }}
      - name: "Overlay current F´ revision"
        uses: actions/checkout@v4
        with:
          submodules: true
          path: ./fprime
          fetch-depth: 0
      - uses: ./fprime/.github/actions/setup
        with:
          location: ./fprime
      - name: "Download and Setup AArch64 Linux Toolchain"
        run: |
          mkdir -p ${AARCH64_TOOLCHAIN_DIR}
          wget -q ${AARCH64_TOOLCHAIN_URL}
          tar -xf $(basename ${AARCH64_TOOLCHAIN_URL}) -C ${AARCH64_TOOLCHAIN_DIR} --strip-components 1
          echo "${AARCH64_TOOLCHAIN_DIR}/bin" >> $GITHUB_PATH
      - name: "Generate AArch64 Linux Build Cache"
        run: |
          fprime-util generate aarch64-linux
      - name: "Build AArch64 Linux"
        run: |
          fprime-util build aarch64-linux
      - name: "Prepare artifacts"
        run: |
          mkdir -p aarch64-linux-artifacts-soak
          cp -r ./build-artifacts aarch64-linux-artifacts-soak
          cp -r Components/Led/test/int aarch64-linux-artifacts-soak
      - name: 'Archive Build Artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-linux-artifacts-soak
          path: aarch64-linux-artifacts-soak
          retention-days: 5

  deploy-service:
    name: "Deploy as System Service"
    runs-on: [self-hosted, ARM64]
    needs: cross-compilation
    steps:
      - name: "Artifacts Download"
        uses: actions/download-artifact@v4
        with:
          name: aarch64-linux-artifacts-soak
      
      - name: "Stop existing services if running"
        run: |
          echo "Stopping existing services if they exist..."
          # Stop and disable services - these commands won't fail if services don't exist
          sudo systemctl stop ${SERVICE_NAME} || true
          sudo systemctl disable ${SERVICE_NAME} || true
          sudo systemctl stop ${SERVICE_NAME}-gds || true
          sudo systemctl disable ${SERVICE_NAME}-gds || true 
          
      - name: "Install new binary"
        run: |
          echo "Installing new binary to ${INSTALL_DIR}..."
          sudo mkdir -p ${INSTALL_DIR}/bin
          sudo mkdir -p ${INSTALL_DIR}/dict
          sudo mkdir -p ${INSTALL_DIR}/test
          sudo mkdir -p ${INSTALL_DIR}/logs
          
          # Copy binary and make executable
          sudo cp ./build-artifacts/aarch64-linux/LedBlinker/bin/LedBlinker ${INSTALL_DIR}/bin/
          sudo chmod +x ${INSTALL_DIR}/bin/LedBlinker
          
          # Copy dictionary and test files
          sudo cp -r ./build-artifacts/aarch64-linux/LedBlinker/dict/* ${INSTALL_DIR}/dict/
          sudo cp -r ./int/* ${INSTALL_DIR}/test/
          
          # Set ownership, so service can access files
          sudo chown -R fprime:fprime ${INSTALL_DIR}
          
      - name: "Create systemd service file"
        run: |
          echo "Creating systemd service file for LedBlinker..."
          sudo tee /etc/systemd/system/${SERVICE_NAME}.service > /dev/null << 'EOF'
          [Unit]
          Description=F' LED Blinker Application, system service meant for soak testing
          After=network.target

          [Service]
          Type=simple
          User=fprime
          WorkingDirectory=/opt/fprime-ledblinker-soak
          ExecStart=/opt/fprime-ledblinker-soak/bin/LedBlinker -a 0.0.0.0 -p 50000
          Restart=always
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          EOF
          
          echo "Creating systemd service file for GDS..."
          sudo tee /etc/systemd/system/${SERVICE_NAME}-gds.service > /dev/null << 'EOF'
          [Unit]
          Description=F' GDS for LED Blinker soak testing
          After=network.target fprime-ledblinker-soak.service
          Requires=fprime-ledblinker-soak.service

          [Service]
          Type=simple
          User=fprime
          WorkingDirectory=/opt/fprime-ledblinker-soak
          ExecStart=fprime-gds --ip-client --ip-address 127.0.0.1 --ip-port 50000 -d /opt/fprime-ledblinker-soak --logs /opt/fprime-ledblinker-soak/logs --framing-selection fprime -g none
          Restart=always
          RestartSec=10
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          EOF 

      - name: "Start and enable services"
        run: |
          echo "Starting and enabling services..."
          sudo systemctl daemon-reload
          
          # Start LedBlinker service first
          sudo systemctl enable ${SERVICE_NAME}
          if ! sudo systemctl start ${SERVICE_NAME}; then
            echo "Failed to start ${SERVICE_NAME} service. Checking status..."
            sudo systemctl status ${SERVICE_NAME} --no-pager -l || true
            echo "Recent service logs:"
            sudo journalctl -u ${SERVICE_NAME} --no-pager -n 20 || true
            echo "Service file contents:"
            sudo cat /etc/systemd/system/${SERVICE_NAME}.service || true
            exit 1
          fi
          
          # Wait for LedBlinker to be ready
          sleep 10
          
          # Start GDS service
          sudo systemctl enable ${SERVICE_NAME}-gds
          if ! sudo systemctl start ${SERVICE_NAME}-gds; then
            echo "Failed to start ${SERVICE_NAME}-gds service. Checking status..."
            sudo systemctl status ${SERVICE_NAME}-gds --no-pager -l || true
            echo "Recent GDS service logs:"
            sudo journalctl -u ${SERVICE_NAME}-gds --no-pager -n 20 || true
            echo "GDS service file contents:"
            sudo cat /etc/systemd/system/${SERVICE_NAME}-gds.service || true
            exit 1
          fi
          
          echo "Checking final service status..."
          sudo systemctl status ${SERVICE_NAME} --no-pager -l
          sudo systemctl status ${SERVICE_NAME}-gds --no-pager -l
          