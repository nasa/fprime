# Soak-test setup for the LedBlinker deployment on AArch64 Linux.
#
# Cross-compiles https://github.com/fprime-community/fprime-workshop-led-blinker and
# installs it on the self-hosted runner as persistent flight-software + GDS
# systemd services.
#
# Pairs with ext-aarch64-linux-led-blinker-soak-test.yml.

name: "Soak Setup: AArch64 Linux LedBlinker"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      service-user:
        description: "Linux user to run the services as"
        required: false
        default: "fprime"

# New releases replace the running deployment
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-compilation:
    name: "Cross Compilation"
    runs-on: ubuntu-22.04
    steps:
      - name: "Setup external repository + overlay F´"
        uses: nasa/fprime-actions/external-repository-setup@devel
        with:
          target_repository: fprime-community/fprime-workshop-led-blinker
          target_ref: devel
      - name: "Cross compile"
        uses: nasa/fprime-actions/build-with-aarch64-toolchain@devel
      - name: "Package soak artifact"
        id: package
        uses: nasa/fprime-actions/soak-package@devel
        with:
          test-source: "LedBlinker/Components/Led/test/int"
      - name: "Archive soak artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ledblinker-soak-artifact
          path: ${{ steps.package.outputs.path }}
          retention-days: 5

  deploy:
    name: "Deploy Soak Services"
    runs-on: [self-hosted, ARM64]
    needs: cross-compilation
    steps:
      - name: "Download soak artifact"
        uses: actions/download-artifact@v4
        with:
          name: ledblinker-soak-artifact
          path: artifacts
      - name: "Deploy FSW + persistent GDS services"
        uses: nasa/fprime-actions/soak-deploy@devel
        with:
          install-dir: /opt/ledblinker-soak
          service-prefix: ledblinker-soak
          service-user: ${{ github.event.inputs.service-user || 'fprime' }}
          binary: "artifacts/build-artifacts/aarch64-linux/*/bin/*"
          dictionary: "artifacts/build-artifacts/aarch64-linux/*/dict/*TopologyDictionary.json"
          requirements: "artifacts/requirements.txt"
          extra-pip-packages: "psutil"
          test-source: "artifacts/int"
          gds-extra-args: "--framing-selection space-packet-space-data-link"
