# Soak Test (generalizable)
#
# Runs on a schedule against the persistent flight-software + GDS services that
# soak-setup.yml installed. Two jobs:
#   1. soak-monitoring     - analyze captured telemetry/events (optional ComLogger
#                            files) for FATALs, resource thresholds, and trends.
#   2. integration-test    - run the deployment's pytest integration tests against
#                            the persistent GDS.
#
# Both jobs reuse the soak actions in nasa/fprime-actions and read everything the
# setup installed under INSTALL_DIR, so this file is deployment-agnostic.
name: "Soak Test (external deployment)"

on:
  # Uncomment to run periodically (e.g. every 30 minutes):
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  INSTALL_DIR: /opt/fprime-soak
  SERVICE_PREFIX: fprime-soak
  # Path (under INSTALL_DIR) to the integration tests to run. A directory runs
  # everything it discovers; point at a single file to narrow it down.
  TEST_PATH: /opt/fprime-soak/test

jobs:
  soak-monitoring:
    name: "Soak Log Analysis"
    runs-on: [self-hosted, ARM64]
    steps:
      - name: "Resolve dictionary path"
        shell: bash
        run: |
          DICT=$(ls -1 ${INSTALL_DIR}/dict/*TopologyDictionary.json | head -n1)
          echo "DICTIONARY=${DICT}" >> "${GITHUB_ENV}"
      - name: "Analyze soak telemetry"
        uses: nasa/fprime-actions/soak-monitor@devel
        with:
          dictionary: ${{ env.DICTIONARY }}
          # ComLogger output is optional; if there are no .com files the monitor
          # simply reports there was nothing to analyze and passes.
          com-logs: ${{ env.INSTALL_DIR }}/ComLoggerFiles
          python: ${{ env.INSTALL_DIR }}/venv/bin/python

  integration-test:
    name: "Integration Test"
    runs-on: [self-hosted, ARM64]
    needs: soak-monitoring
    steps:
      - name: "Check flight-software service is running"
        shell: bash
        run: |
          if sudo systemctl is-active --quiet ${SERVICE_PREFIX}-fsw; then
            echo "✅ ${SERVICE_PREFIX}-fsw is running"
          else
            echo "::error::${SERVICE_PREFIX}-fsw is not running"
            sudo systemctl status ${SERVICE_PREFIX}-fsw --no-pager -l || true
            sudo journalctl -u ${SERVICE_PREFIX}-fsw --no-pager -n 40 || true
            exit 1
          fi
      - name: "Resolve dictionary path"
        shell: bash
        run: |
          DICT=$(ls -1 ${INSTALL_DIR}/dict/*TopologyDictionary.json | head -n1)
          echo "DICTIONARY=${DICT}" >> "${GITHUB_ENV}"
      - name: "Run integration tests against persistent GDS"
        uses: nasa/fprime-actions/soak-integration-test@devel
        with:
          venv: ${{ env.INSTALL_DIR }}/venv
          dictionary: ${{ env.DICTIONARY }}
          test-path: ${{ env.TEST_PATH }}
          working-directory: ${{ env.INSTALL_DIR }}
