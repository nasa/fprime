# Unit test verification for the F´ framework.

name: "Framework Unit Tests"

on:
  push:
    branches: [ devel, release/** ]
  pull_request:
    branches: [ devel, release/** ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (e.g. ubuntu-22.04, macos-latest)"
        required: false
        default: "ubuntu-22.04"
      python-version:
        description: "Python version (only used on macOS runners)"
        required: false
        default: "3.12"
      jobs:
        description: "Parallel job count: a number, 'random' (1-32), or empty to omit -j"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'devel') && !contains(github.ref, 'release/') }}

jobs:
  unit-tests:
    name: "Framework UTs (${{ matrix.runner }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            jobs: "random"
          - runner: macos-latest
            python-version: "3.12"
            jobs: "2"
    runs-on: ${{ github.event.inputs.runner || matrix.runner }}
    steps:
      - name: "Checkout F´ Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: "Setup Python"
        if: contains(github.event.inputs.runner || matrix.runner, 'macos')
        uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.python-version || matrix.python-version }}
      - name: "Setup F´ Tools"
        uses: nasa/fprime-actions/setup@devel
      - name: "Run Unit Tests"
        uses: ./.github/actions/run-unit-tests
        with:
          framework-uts: "ON"
          jobs: ${{ github.event.inputs.jobs || matrix.jobs }}
