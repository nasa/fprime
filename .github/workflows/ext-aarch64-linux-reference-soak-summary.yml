# On-demand soak summary for the F´ soak reference deployment on AArch64 Linux.
#
# Reads the persistent soak log written by soak-setup / soak-test and
# prints a chronological summary of every event, alert, and telemetry
# channel captured over the life of the soak.

name: "Soak Summary: AArch64 Linux Reference"

on:
  workflow_dispatch:

permissions:
  contents: read

# Shared with the soak-setup + soak-test workflows so a summary queues
# behind any in-flight test and doesn't race the log writer.
concurrency:
  group: soak-reference-aarch64
  cancel-in-progress: false

jobs:
  soak-summary:
    name: "Soak Summary"
    runs-on: [self-hosted, ARM64, soak-test]
    steps:
      - uses: nasa/fprime-actions/soak-summary@devel
        with:
          deployment-name: soak-reference-aarch64
