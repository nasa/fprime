# Build, unit test, and static analysis verification for the F' framework.

name: "Framework"

on:
  schedule:
    - cron: "0 21 * * *"  # Nightly at 2:00 PM US/Pacific (PDT)
  push:
    branches: [ release/** ]
  pull_request:
    branches: [ devel, release/** ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/agents/**'
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (e.g. ubuntu-22.04, macos-latest)"
        required: false
        default: ""
      jobs:
        description: "Parallel job count: a number, 'random' (1-32), or empty to omit -j"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'devel') && !contains(github.ref, 'release/') }}

permissions:
  contents: read

jobs:
  build:
    name: "Build [${{ matrix.runner }}]"
    strategy:
      fail-fast: false
      matrix:
        # macOS runs only on the nightly schedule
        include: ${{ github.event_name == 'schedule' && fromJSON('[{"runner":"ubuntu-22.04","jobs":"random"},{"runner":"macos-latest","jobs":"2"}]') || fromJSON('[{"runner":"ubuntu-22.04","jobs":"random"}]') }}
    timeout-minutes: 30
    runs-on: ${{ github.event.inputs.runner || matrix.runner }}
    steps:
      - name: "Checkout F' Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: true
      - name: "Setup F' Tools"
        uses: nasa/fprime-actions/setup@devel
        with:
          location: ${{ github.workspace }}
      - name: "Build Framework"
        uses: nasa/fprime-actions/build@devel
        with:
          build-all: "true"
          jobs: ${{ github.event.inputs.jobs || matrix.jobs }}

  unit-tests:
    name: "UTs [${{ matrix.runner }}]"
    strategy:
      fail-fast: false
      matrix:
        # macOS runs only on the nightly schedule
        include: ${{ github.event_name == 'schedule' && fromJSON('[{"runner":"ubuntu-22.04","jobs":"random"},{"runner":"macos-latest","jobs":"2"}]') || fromJSON('[{"runner":"ubuntu-22.04","jobs":"random"}]') }}
    timeout-minutes: 30
    runs-on: ${{ github.event.inputs.runner || matrix.runner }}
    steps:
      - name: "Checkout F' Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: true
      - name: "Setup F' Tools"
        uses: nasa/fprime-actions/setup@devel
        with:
          location: ${{ github.workspace }}
      - name: "Run Unit Tests"
        uses: nasa/fprime-actions/run-unit-tests@devel
        with:
          jobs: ${{ github.event.inputs.jobs || matrix.jobs }}

  tsan:
    name: "TSan UTs"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: "Checkout F' Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: true
      - name: "Setup F' Tools"
        uses: nasa/fprime-actions/setup@devel
        with:
          location: ${{ github.workspace }}
      - name: "Run Unit Tests (TSan)"
        uses: nasa/fprime-actions/run-tsan-tests@devel
        with:
          jobs: ${{ github.event.inputs.jobs || 'random' }}
          tsan-options: "halt_on_error=1 history_size=5 suppressions=${{ github.workspace }}/.github/tsan-suppressions.txt"

  quality:
    name: "Quality"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: "Checkout F' Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: true
      - name: "Setup F' Tools"
        uses: nasa/fprime-actions/setup@devel
        with:
          location: ${{ github.workspace }}
      - name: "Install clang-tidy"
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-12
      - name: "Generate with clang-tidy"
        shell: bash
        run: |
          fprime-util generate \
            -DCMAKE_C_COMPILER=gcc-10 \
            -DCMAKE_CXX_COMPILER=g++-10 \
            -DCMAKE_CXX_CLANG_TIDY="clang-tidy-12;--config-file=${{ github.workspace }}/release.clang-tidy"
      - name: "Build (static analysis runs during compilation)"
        shell: bash
        run: fprime-util build --all

  timing-check:
    name: "Timing Check"
    runs-on: ubuntu-latest
    needs: [build, unit-tests, tsan, quality]
    if: always()
    permissions:
      actions: read
      contents: read
    steps:
      - name: "Check Job Timings"
        uses: nasa/fprime-actions/timing-check@devel
