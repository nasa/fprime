# This workflow is intended for reuse by other workflows and will not run directly (no triggers).
# The behavior is to run integration tests against a pre-built external F´ deployment using a
# selectable ground system: fprime-gds (default) or fprime-yamcs.
name: "F´ Integration Tests - Reusable Workflow"

on:
  workflow_call:
    inputs:
      target_repository:
        description: "External repository to checkout (<owner>/<repo>)"
        required: true
        type: string
      target_ref:
        description: "Branch on target to checkout"
        required: false
        type: string
        default: "devel"
      deployment:
        description: "Deployment binary name. E.g. MyProject_MyDeployment"
        required: true
        type: string
      dictionary:
        description: "Path to the deployment topology dictionary JSON"
        required: true
        type: string
      deployment_config:
        description: "Path to the integration test deployment config JSON"
        required: true
        type: string
      test_paths:
        description: "Whitespace-separated list of pytest paths to run"
        required: true
        type: string
      ground_system:
        description: "Ground system used to run the tests: fprime-gds or fprime-yamcs"
        required: false
        type: string
        default: "fprime-gds"
      gds_package:
        description: "pip requirement specifier used to install the GDS. E.g. fprime-gds==4.2.2a4"
        required: false
        type: string
        default: "fprime-gds"
      artifact_name:
        description: "Name of the build artifact containing build-artifacts/"
        required: false
        type: string
        default: "examples-build-artifacts"
      runs_on:
        description: "Platform to run on. Defaults to ubuntu-22.04"
        required: false
        type: string
        default: "ubuntu-22.04"

permissions:
  contents: read

jobs:
  test:
    name: "Integration Tests (${{ inputs.ground_system }})"
    runs-on: ${{ inputs.runs_on }}
    env:
      DEPLOYMENT: ${{ inputs.deployment }}
      DICTIONARY: ${{ inputs.dictionary }}
      DEPLOYMENT_CONFIG: ${{ inputs.deployment_config }}
      GROUND_SYSTEM: ${{ inputs.ground_system }}
    steps:
      - name: "Setup external repository + overlay F´"
        uses: nasa/fprime-actions/external-repository-setup@devel
        with:
          target_repository: ${{ inputs.target_repository }}
          target_ref: ${{ inputs.target_ref }}

      - name: "Download build artifacts"
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: build-artifacts

      - name: "Setup Java 17 for YAMCS"
        if: inputs.ground_system == 'fprime-yamcs'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Setup Python environment"
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "${{ inputs.gds_package }}"

      - name: "Setup YAMCS Python environment"
        if: inputs.ground_system == 'fprime-yamcs'
        run: |
          pip install "yamcs-client<2.0.0"
          pip install "fprime-xtce>=0.1.3"
          pip install "fprime-yamcs>=0.1.4"

      # Upgrade GDS to a matching pr-xxxx branch if it exists; never fall back to devel
      - name: "Upgrade fprime-gds to pr-xxxx (if it exists)"
        if: github.event_name == 'pull_request'
        uses: nasa/fprime-actions/upgrade-package@devel
        with:
          repository: nasa/fprime-gds
          pr-branch-only: true

      - name: "Prepare deployment"
        run: |
          chmod +x ./build-artifacts/Linux/${DEPLOYMENT}/bin/${DEPLOYMENT}
          mkdir -p ci-logs

      - name: "Start F´ deployment with YAMCS"
        if: inputs.ground_system == 'fprime-yamcs'
        run: |
          fprime-yamcs --ip-client \
            -d ${PWD}/build-artifacts/Linux/${DEPLOYMENT} \
            --logs ${PWD}/ci-logs &
          sleep 15
          if ! jobs -r | grep -q fprime-yamcs; then
            echo "ERROR: YAMCS failed to start"
            cat ${PWD}/ci-logs/*.log 2>/dev/null || true
            exit 1
          fi
          for i in {1..30}; do
            python -c "from yamcs.client import YamcsClient; YamcsClient('127.0.0.1:8090')" 2>/dev/null && { echo "YAMCS ready"; sleep 5; exit 0; }
            sleep 2
          done
          echo "YAMCS timeout" && exit 1

      - name: "Start F´ deployment with GDS"
        if: inputs.ground_system == 'fprime-gds'
        run: |
          fprime-gds -g none \
            -d ${PWD}/build-artifacts/Linux/${DEPLOYMENT} \
            --logs ${PWD}/ci-logs &
          sleep 15
          if ! jobs -r | grep -q fprime-gds; then
            echo "ERROR: GDS failed to start"
            cat ${PWD}/ci-logs/*.log 2>/dev/null || true
            exit 1
          fi

      - name: "Run integration tests"
        run: |
          USE_YAMCS_FLAG=""
          if [ "${GROUND_SYSTEM}" = "fprime-yamcs" ]; then
            USE_YAMCS_FLAG="--use-yamcs"
          fi
          pytest --dictionary ${DICTIONARY} \
            --deployment-config ${DEPLOYMENT_CONFIG} \
            ${USE_YAMCS_FLAG} \
            -v \
            ${{ inputs.test_paths }}
        shell: bash

      - name: "Archive test logs"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-logs-${{ inputs.ground_system }}
          path: ci-logs
          retention-days: 5
