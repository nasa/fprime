# F Prime Multi-Agent PR Review — Agent Registry
#
# Authoritative list of the agents that participate in the multi-agent
# PR review flow. The orchestrator iterates over `role: reviewer`
# entries to drive reviewers, then invokes the `role: aggregator`
# entry. The `role: orchestrator` entry is the single human entry
# point.
#
# Adding a new reviewer agent in the future is a matter of adding a
# new entry here with `role: reviewer`, a `review_group`, plus the
# agent file. No code changes elsewhere are required.
#
# Review groups (`review_group`) — session packing
# ------------------------------------------------
# Reviewers are lenses, not processes. The orchestrator packs the
# reviewer set into one review session per `review_group` and runs
# every lens in that group inside it, in registry order. Each lens
# still posts its own inline comments and its own hidden-metadata
# review exactly as before, so the GitHub-side artifacts, finding
# keys, run ordinals and the aggregator's per-agent table are
# unchanged by how lenses are packed. Grouping exists because session
# startup, not prompt content, dominates review cost: measured over
# small, medium and large PRs, one session per lens costs roughly
# twice what four grouped sessions cost for the same findings.
#
# Rules the orchestrator enforces (see review-orchestrator.agent.md
# §Sequence, review contract §13):
#
#   1. Every `role: reviewer` entry carries `review_group`. A missing
#      or unrecognized value is not an error and never drops a lens:
#      that reviewer runs in its own session. Adding a reviewer
#      without touching this header is therefore always safe, just
#      not maximally cheap.
#   2. Any reviewer with `contributes_to_ci_safety: true` belongs to
#      `review_group: safety`, which is exempt from the review effort
#      budget (contract §13). Safety lenses read in full and trace
#      untrusted input to exhaustion; the savings come from the other
#      groups.
#   3. At most four lenses per session. A group that grows past four
#      is split into as many sessions as needed, in registry order --
#      five lenses sharing one context measurably dropped scopes.
#   4. An optional `routing_skip_when` predicate lets the
#      orchestrator skip a lens on a PR that touches nothing in its
#      scope (review-orchestrator.agent.md §Routing). Predicates are
#      evaluated against the changed-file list only, are conservative
#      by construction, and default to absent — a lens without one
#      always runs, and no predicate may be written for a safety
#      lens. A skipped lens is reported as skipped, not as a lens
#      that did not run, and forces no verdict.
#   5. Groups run in the order `safety`, `code`, `system`,
#      `verification`, then any single-lens groups in registry order.
#      Safety first because it is the CI-safety contributor; the
#      fixed order is what makes the first-poster-wins concurrence
#      rule (contract §6a) deterministic.

agents:

  - name: F Prime PR Review Orchestrator
    short_name: review-orchestrator
    role: orchestrator
    path: .github/agents/review-orchestrator.agent.md
    invocable_by_humans: true
    notes: >
      Single human entry point. Packs the `role: reviewer` lenses
      into one review session per `review_group`, drives those
      sessions in fixed order, then performs the `role: aggregator`
      work itself. Owns session assembly, routing, the effort-budget
      blocks (contract 13), kickoff prompts (with the
      orchestrator->agent thanks convention), severity reconciliation
      (contract 14) and error handling.

  - name: F Prime Full-Codebase Review Orchestrator
    short_name: full-codebase-review
    role: batch-orchestrator
    path: .github/agents/full-codebase-review.agent.md
    invocable_by_humans: true
    notes: >
      Single human entry point for the batch (full-codebase) review.
      Partitions the repository into review units per
      `_shared/skills/repo-partitioning.skill.md`, drives every
      `role: reviewer` entry over every unit under the batch
      contract (`_shared/review-contract-batch.md`), and maintains
      the resumable ledger and diffable finding artifacts in a
      results repository. Not part of the PR review flow.

  - name: F Prime Security Vulnerability Reviewer
    short_name: security-review
    review_label: Security
    role: reviewer
    review_group: safety
    path: .github/agents/security-review.agent.md
    invocable_by_humans: true
    contributes_to_ci_safety: true
    scope_summary: >
      Eight categories: ground-input asserts (DoS), ground-input
      overflow (DDoS), ground-input validation gaps, the same three
      for hardware inputs, general security vulnerabilities, and CI
      test-runtime policy enforcement.

  - name: F Prime Supply Chain / Runner Safety Reviewer
    short_name: supply-chain-review
    review_label: Supply Chain
    role: reviewer
    review_group: safety
    path: .github/agents/supply-chain-review.agent.md
    invocable_by_humans: true
    contributes_to_ci_safety: true
    scope_summary: >
      Dependency manifests, third-party / vendored / submodule
      changes, build/test infrastructure, workflow / action / script
      changes, generators, container images, runner-safety surfaces,
      prompt-injection fingerprints, and review-system integrity
      (changes to agent specs, contract, skills, and registry).

  - name: F Prime C/C++ Design Reviewer
    short_name: fprime-code-review
    review_label: C++ Design
    role: reviewer
    review_group: code
    routing_skip_when: >
      The PR's changed-file list contains no C or C++ source or
      header file.
    path: .github/agents/fprime-code-review.agent.md
    invocable_by_humans: true
    scope_summary: >
      C/C++ design-rule conformance (CPP-1 through CPP-37 in
      `.github/skills/fprime-cpp-design/SKILL.md`): no dynamic memory
      post-init, Fw::Buffer ownership, FW_ASSERT scope, C++14
      language subset, F Prime type idioms (Fw::String,
      Fw/DataStructures, FPP modeled types on ground-facing
      interfaces), and JPL / style-guide conformance. Does not
      contribute to CI safety.

  - name: F Prime Stale Documentation Reviewer
    short_name: stale-documentation-review
    review_label: Documentation
    role: reviewer
    review_group: verification
    path: .github/agents/stale-documentation-review.agent.md
    invocable_by_humans: true
    scope_summary: >
      Eight categories: component SDDs (`*/docs/sdd.md`), user manual
      (`docs/user-manual/`), how-to guides (`docs/how-to/`),
      reference catalogs (`docs/reference/`), tutorials
      (`docs/tutorials/`, plus external `fprime-community/*`),
      top-level project docs (README / INSTALL / CONTRIBUTING),
      public-API Doxygen comments, and missing-doc-for-new-surface.
      Does not contribute to CI safety.

  - name: F Prime Design Reviewer
    short_name: design-review
    review_label: Design
    role: reviewer
    review_group: system
    path: .github/agents/design-review.agent.md
    invocable_by_humans: true
    scope_summary: >
      Nine design categories — design-vs-intent mismatch,
      code-vs-design mismatch, F Prime pattern violations, scope
      creep / under-scoped, FPP-vs-C++ divergence, undocumented
      behavioral regression, resource margin erosion, fault-handling
      gap, missed reuse of an existing facility — plus the special
      `design-needs-human-adjudication` finding class that always
      pings code owners. References the
      JPL Design Principles skill for margin and fault-protection
      rules. Does not contribute to CI safety.

  - name: F Prime Architecture Reviewer
    short_name: architecture-review
    review_label: Architecture
    role: reviewer
    review_group: system
    routing_skip_when: >
      The PR's changed-file list contains no `.fpp` model, no
      topology or deployment file, and no component source or header.
    path: .github/agents/architecture-review.agent.md
    invocable_by_humans: true
    scope_summary: >
      Seven categories: sync port on async component, async port on
      passive component, component-kind / port-kind incoherence,
      rate-group pattern violation, unclassifiable component, F Prime
      architectural primitive misuse, and undocumented architectural
      departure. Classifies each touched component's prevailing
      architecture (cyclic, event-driven, background, hybrid) and
      flags changes that erode it. Does not contribute to CI safety.

  - name: F Prime Test Quality Reviewer
    short_name: test-quality-review
    review_label: Test Quality
    role: reviewer
    review_group: verification
    routing_skip_when: >
      The PR's changed-file list contains no test file and no C/C++,
      Python, or `.fpp` source whose behavior a test could cover.
    path: .github/agents/test-quality-review.agent.md
    invocable_by_humans: true
    scope_summary: >
      Ten test categories: missing tests for newly-added FPP
      surface, stale tests on modified FPP elements, invocations
      without assertions, missing doDispatch() on async paths,
      tautological assertions, count-only assertions without
      payload check, newly-introduced weakening (DISABLED_,
      GTEST_SKIP, removed asserts), missing failure-path coverage
      on new commands, multi-instance ports tested only at index 0,
      and missing throttle / update-on-change verification. Draws
      on the proposal at nasa/fprime#5160. Does not contribute to
      CI safety.

  - name: F Prime Correctness Reviewer
    short_name: correctness-review
    review_label: Correctness
    role: reviewer
    review_group: code
    routing_skip_when: >
      The PR's changed-file list contains no executable source of any
      kind (C/C++, Python, CMake, shell).
    path: .github/agents/correctness-review.agent.md
    invocable_by_humans: true
    scope_summary: >
      General functional correctness. Twelve named categories —
      boundary / off-by-one, inverted or incomplete predicates,
      state-machine and protocol-sequence defects, unhandled enum
      values, integer arithmetic (wrap, truncation, signed/unsigned,
      divide-by-zero), ignored status returns, resource / buffer /
      handle leaks, initialization and lifetime defects, copy-paste
      substitution errors, loop non-termination, concurrency defects
      outside the port-kind rules, and violations of framework
      facility contracts — plus `correctness-other`, a catch-all for
      any other confirmed defect, since the named list is a memory
      aid rather than a closed scope. Asks only "does this code do
      what it is evidently intended to do, for every reachable
      input" — defensive defect-finding, not exploitability analysis
      (that is security-review's scope). Does not contribute to CI
      safety.

  - name: F Prime Operational Consequences Reviewer
    short_name: operational-consequences-review
    review_label: Operational
    role: reviewer
    review_group: system
    path: .github/agents/operational-consequences-review.agent.md
    invocable_by_humans: true
    scope_summary: >
      Operational consequences of documented behavior on a flight
      system, reviewed from the operator's seat rather than the
      author's. Five passes — interface-contract tracing (framework
      call-site assumptions and parameters silently ignored by
      concrete interface implementations), failure-path blast radius
      (heuristic / spurious statuses meeting assert-on-overflow or
      drop-on-full callers), timing and resource budgets (quantified
      polling wakeup rates, livelock / starvation / priority
      inversion under strict-priority schedulers, preemption-window
      visibility), configuration-space extremes (minimum type
      widths, depth=1, degenerate values, with quantified degraded
      guarantees), and documentation-versus-reality audits of
      quantified claims — plus `ops-other` for any other confirmed
      operational hazard. Findings are ranked by mission impact and
      quantified; documentation plus configuration guidance is an
      acceptable remedy. Assumes local correctness
      (correctness-review's scope). Does not contribute to CI
      safety.

  - name: F Prime Maintainability & Readability Reviewer
    short_name: maintainability-review
    review_label: Maintainability
    role: reviewer
    review_group: code
    routing_skip_when: >
      The PR's changed-file list contains no executable source of any
      kind (C/C++, Python, CMake, shell).
    path: .github/agents/maintainability-review.agent.md
    invocable_by_humans: true
    scope_summary: >
      Eleven categories: unclear / misleading naming, oversized or
      overly-complex functions, deep nesting / convoluted control
      flow, copy-paste duplication in production code, dead or
      commented-out code introduced by the diff, misleading or
      stale inline comments, unclear parameter shapes
      (boolean-flag arguments, long positional lists),
      inconsistency with the surrounding file's local conventions,
      inexplicit return values (bare bools / raw int status codes),
      overly-clever constructs, and structure carrying behavior
      (brace-less bodies, asymmetric returns across branches --
      fragile-edit hazards). Does not contribute to CI safety.

  - name: F Prime PR Review Summary Aggregator
    short_name: review-summary
    role: aggregator
    path: .github/agents/review-summary.agent.md
    invocable_by_humans: true
    notes: >
      Consumes per-agent hidden metadata and inline comments on the
      PR (matched by HTML marker plus the orchestrator-provided
      status list) and submits ONE PR review (APPROVE or
      REQUEST_CHANGES) with the consolidated table, CI safety
      verdict, merge readiness verdict, optional Recommend Close
      section, outstanding must-fix bullets, a since-last-run delta
      table, and the severity-reconciliation promotion log
      (contract 14). The orchestrator executes this role itself once
      the reviewer sessions have settled, rather than spawning a
      further session for it (review-orchestrator.agent.md
      Aggregation); this file remains the source of truth for what
      the summary contains either way, and the agent stays
      separately invocable for debugging.
