name: Feature Request
description: Suggest an improvement to F´
labels:
  - enhancement
type: feature
body:
  - type: input
    id: fprime-version
    attributes:
      label: F´ version and affected component
      description: Which version of F´ are you using, and which component would this feature affect?
      value: devel / <component>
  - type: textarea
    id: description
    attributes:
      label: Feature description and rationale
      description: Describe the feature you are requesting and why F´ needs it.
      value: |
        ### Feature description

        ### Rationale
    validations:
      required: true
  - type: textarea
    id: proposed-approach
    attributes:
      label: Proposed approach
      description: Optionally describe how this feature could be implemented.
  - type: checkboxes
    id: breaking-change
    attributes:
      label: Breaking change
      options:
        - label: This feature would introduce a breaking change.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I understand that contributions go through the [CCB process](https://github.com/nasa/fprime/blob/devel/GOVERNANCE.md#the-decision-making-process) described in [CONTRIBUTING.md](https://github.com/nasa/fprime/blob/devel/CONTRIBUTING.md).
          required: true
        - label: AI assistance was used in writing this issue. See the [AI policy](https://github.com/nasa/fprime/blob/devel/AI_POLICY.md).
