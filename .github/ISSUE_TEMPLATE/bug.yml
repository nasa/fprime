name: Bug Report
description: Report a problem using F´
labels:
  - bug
type: bug
body:
  - type: textarea
    id: problem-description
    attributes:
      label: Problem description
      description: Describe the problem with sufficient detail to understand the issue.
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce
      description: List the steps needed to reproduce the problem.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I understand that contributions go through the [CCB process](https://github.com/nasa/fprime/blob/devel/GOVERNANCE.md#the-decision-making-process) described in [CONTRIBUTING.md](https://github.com/nasa/fprime/blob/devel/CONTRIBUTING.md).
          required: true
        - label: AI assistance was used in writing this issue. See the [AI policy](https://github.com/nasa/fprime/blob/devel/AI_POLICY.md).
  - type: textarea
    id: environment
    attributes:
      label: F´ version and affected component
      description: Run `fprime-util version-check`, paste the output, and name the affected component.
      render: shell
      placeholder: |
        $ fprime-util version-check
        <paste output here>

        Affected component: <component>
