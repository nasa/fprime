name: Bug Report
description: Report a problem using F´
labels:
  - bug
type: bug
body:
  - type: input
    id: fprime-version
    attributes:
      label: F´ version and affected component
      description: Which version of F´ are you using, and which component is affected?
      value: devel
  - type: textarea
    id: problem-description
    attributes:
      label: Problem description
      description: Describe the problem with sufficient detail to understand the issue.
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce and expected behavior
      description: List the steps needed to reproduce the problem, and describe the behavior you expected.
      placeholder: |
        1.
        2.
        3.

        Expected:
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I understand that contributions go through the [CCB process](https://github.com/nasa/fprime/blob/devel/GOVERNANCE.md) described in [CONTRIBUTING.md](https://github.com/nasa/fprime/blob/devel/CONTRIBUTING.md).
          required: true
        - label: AI assistance was used in writing this issue. See the [AI policy](https://github.com/nasa/fprime/blob/devel/AI_POLICY.md).
  - type: textarea
    id: version-check
    attributes:
      label: fprime-util version-check output
      description: Run `fprime-util version-check` and paste the output.
      render: shell
