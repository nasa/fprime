name: Task
description: Propose a task for F´
type: task
body:
  - type: textarea
    id: description
    attributes:
      label: Task description
      description: Describe the task.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Explain why this task should be completed.
    validations:
      required: true
  - type: textarea
    id: proposed-approach
    attributes:
      label: Proposed approach
      description: Optionally describe how this task could be completed.
  - type: checkboxes
    id: breaking-change
    attributes:
      label: Breaking change
      options:
        - label: This task would introduce a breaking change.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I understand that contributions go through the [CCB process](https://github.com/nasa/fprime/blob/devel/GOVERNANCE.md#the-decision-making-process) described in [CONTRIBUTING.md](https://github.com/nasa/fprime/blob/devel/CONTRIBUTING.md).
          required: true
        - label: AI assistance was used in writing this issue. See the [AI policy](https://github.com/nasa/fprime/blob/devel/AI_POLICY.md).
  - type: textarea
    id: environment
    attributes:
      label: F´ version and affected component
      description: Run `fprime-util version-check`, paste the output, and name the affected component.
      render: shell
      placeholder: |
        $ fprime-util version-check
        <paste output here>

        Affected component: <component>
