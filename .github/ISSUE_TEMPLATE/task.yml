name: Task
description: Propose a task for F´
type: task
body:
  - type: input
    id: fprime-version
    attributes:
      label: F´ version and affected component
      description: Which version of F´ are you using, and which component would this task affect?
      value: devel / <component>
  - type: textarea
    id: description
    attributes:
      label: Task description, rationale, and proposed approach
      description: Describe the task, why it should be completed, and optionally how it could be completed.
      value: |
        ### Task description

        ### Rationale

        ### Proposed approach
    validations:
      required: true
  - type: checkboxes
    id: breaking-change
    attributes:
      label: Breaking change
      options:
        - label: This task would introduce a breaking change.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I understand that contributions go through the [CCB process](https://github.com/nasa/fprime/blob/devel/GOVERNANCE.md) described in [CONTRIBUTING.md](https://github.com/nasa/fprime/blob/devel/CONTRIBUTING.md).
          required: true
        - label: AI assistance was used in writing this issue. See the [AI policy](https://github.com/nasa/fprime/blob/devel/AI_POLICY.md).
