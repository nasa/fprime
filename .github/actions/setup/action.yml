name: 'Setup F´'
description: 'Setup the F´ repository and tools'
inputs:
  location:
    required: true
    default: ${{ github.workspace }}
runs:
  using: "composite"
  steps:
  - run: git fetch --tags
    shell: bash
  # Python path should be added at a higher level
  - run: pip3 install setuptools_scm wheel urllib3
    shell: bash
  - run: pip3 install -U -r "${LOCATION}/requirements.txt"
    shell: bash
    env:
      LOCATION: ${{ inputs.location }}
  - run: which fprime-util
    shell: bash
  - run: which fprime-gds
    shell: bash
  - run: which fpp-check
    shell: bash
    
