name: "CodeQL security and quality"

queries: 
  - uses: security-and-quality

query-filters:
  - include: 
      id: cpp/incorrect-not-operator-usage
  - include: 
      tags contain: correctness
  - include: 
      tags contain: reliability

# NOTE: for compiled languages (cpp) paths-ignore does not filter results by
# itself; the actual exclusion is the filter-sarif step in
# codeql-security-scan.yml. It does apply to interpreted languages (python).
paths-ignore:
  # CMake-internal generated sources (try_compile checks, compiler id, feature
  # tests) inside the build cache; the cache itself is still needed so that
  # F Prime autocoded sources are built and analyzed
  - "**/CMakeFiles/**"
  # Third-party dependencies fetched by CMake (e.g. googletest via FetchContent)
  - "**/_deps/**"
  - docs/
  - cmake/docs/
  - cmake/test/
  - Autocoders/Python/src/fprime_ac/utils/DiffAndRename.py
  - Autocoders/Python/src/fprime_ac/utils/pyparsing.py
