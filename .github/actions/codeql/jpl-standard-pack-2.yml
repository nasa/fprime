name: "CodeQL JPL Coding Standard - Recommendations 1 of 2"

disable-default-queries: true

packs:
  # Source of the query pack is https://github.com/github/codeql/tree/main/cpp/ql/src/JPL_C
  - codeql/cpp-queries:JPL_C

queries:
  # FW_ASSERT-aware replacements for the Rule 16 assertion queries
  - uses: ./.github/codeql/fprime-queries

query-filters:
  - exclude:
      problem.severity:
        - error
        - warning
  # We are excluding the following query because it overflows the limit of
  # 5000 results that the SARIF upload can handle
  # This sole query is ran in jpl-standard-pack-3.yml
  # https://docs.github.com/en/code-security/code-scanning/integrating-with-code-scanning/uploading-a-sarif-file-to-github#uploading-a-code-scanning-analysis-with-github-actions
  - exclude:
      id:
        - cpp/jpl-c/basic-int-types
  # Excluded in favor of the FW_ASSERT-aware replacement above, which
  # recognizes F Prime's FW_ASSERT macro as an assertion
  - exclude:
      id:
        - cpp/jpl-c/use-of-assertions-density
  # Moved to jpl-standard-known-autocode-issues.yml (build paths excluded): the
  # autocoder emits conditional-compilation directives (include guards, #ifdef)
  # in generated headers, so the Rule 20 "Conditional compilation" check runs
  # there to guard only hand-written sources.
  - exclude:
      id:
        - cpp/jpl-c/preprocessor-use-ifdef
  # Moved to jpl-standard-known-autocode-issues.yml (build paths excluded): the
  # autocoder emits long generated functions, so the Rule 25 "Function too long"
  # check runs there to guard only hand-written sources.
  - exclude:
      id:
        - cpp/jpl-c/function-size-limits

paths-ignore:
  # CMake-internal generated sources (try_compile checks, compiler id, feature
  # tests) inside the build cache; the cache itself is still needed so that
  # F Prime autocoded sources are built and analyzed
  - "**/CMakeFiles/**"
  # Third-party dependencies fetched by CMake (e.g. googletest via FetchContent)
  - "**/_deps/**"
