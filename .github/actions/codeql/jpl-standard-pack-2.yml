name: "CodeQL JPL Coding Standard - Recommendations 1 of 2"

disable-default-queries: true

packs:
  # Source of the query pack is https://github.com/github/codeql/tree/main/cpp/ql/src/JPL_C
  - codeql/cpp-queries:JPL_C

queries:
  # FW_ASSERT-aware replacements for the Rule 16 assertion queries
  - uses: ./.github/codeql/fprime-queries

query-filters:
  - exclude:
      problem.severity:
        - error
        - warning
  # These recommendation-severity queries fire heavily on autocoded sources,
  # so they run in jpl-standard-known-autocode-issues.yml with build paths
  # excluded to guard only hand-written code
  - exclude:
      id:
        - cpp/fprime/magic-numbers
        - cpp/fprime/public-data-member
        - cpp/fprime/incomplete-code
  # We are excluding the following query because it overflows the limit of
  # 5000 results that the SARIF upload can handle
  # This sole query is ran in jpl-standard-pack-3.yml
  # https://docs.github.com/en/code-security/code-scanning/integrating-with-code-scanning/uploading-a-sarif-file-to-github#uploading-a-code-scanning-analysis-with-github-actions
  - exclude:
      id:
        - cpp/jpl-c/basic-int-types
  # The F Prime refinement of the Rule 17 query runs in jpl-standard-pack-3.yml
  # (its include-only filter selects it there); excluding it here prevents the
  # same alerts from being reported by two runs
  - exclude:
      id:
        - cpp/fprime/jpl-c/basic-int-types
  # Excluded in favor of the F Prime refinement
  # cpp/fprime/jpl-c/non-const-function-pointer, which does not mistake
  # unresolved calls in uninstantiated C++ template code (e.g. the
  # Fw/DataStructures container templates) for function-pointer calls
  - exclude:
      id:
        - cpp/jpl-c/non-const-function-pointer
  # Excluded in favor of the FW_ASSERT-aware replacement above, which
  # recognizes F Prime's FW_ASSERT macro as an assertion. The replacement
  # (cpp/fprime/jpl-c/use-of-assertions-density) is also excluded here: the
  # autocoder emits large amounts of assertion-free code, so it runs in
  # jpl-standard-known-autocode-issues.yml with build paths excluded.
  - exclude:
      id:
        - cpp/jpl-c/use-of-assertions-density
        - cpp/fprime/jpl-c/use-of-assertions-density
  # Excluded in favor of the F Prime refinement
  # (cpp/fprime/jpl-c/multiple-stmts-per-line), which understands C++
  # constructs the stock C query miscounts: template instantiations,
  # single-line inline member functions, blocks, case labels, and
  # multi-statement macro expansions.
  - exclude:
      id:
        - cpp/jpl-c/multiple-stmts-per-line
  # Excluded in favor of the F Prime refinement
  # (cpp/fprime/jpl-c/multiple-var-decls-per-line), which does not mistake the
  # compiler-generated variables of a C++ range-based for loop (__range,
  # __begin, __end) for multiple declarations on one line
  - exclude:
      id:
        - cpp/jpl-c/multiple-var-decls-per-line
  # Moved to jpl-standard-known-autocode-issues.yml (build paths excluded): the
  # autocoder emits conditional-compilation directives (include guards, #ifdef)
  # in generated headers, so the Rule 20 "Conditional compilation" check runs
  # there to guard only hand-written sources.
  # The F Prime refinement (cpp/fprime/jpl-c/preprocessor-use-ifdef) also runs
  # there, not here, since this run does not exclude build paths.
  - exclude:
      id:
        - cpp/jpl-c/preprocessor-use-ifdef
        - cpp/fprime/jpl-c/preprocessor-use-ifdef
  # Moved to jpl-standard-known-autocode-issues.yml (build paths excluded): the
  # autocoder emits long generated functions, so the Rule 25 "Function too long"
  # check runs there to guard only hand-written sources.
  - exclude:
      id:
        - cpp/jpl-c/function-size-limits

# NOTE: for compiled languages paths-ignore does not filter results by itself;
# the actual exclusion is the filter-sarif step in codeql-jpl-standard.yml.
# Kept here for documentation and for file-coverage accounting.
paths-ignore:
  # CMake-internal generated sources (try_compile checks, compiler id, feature
  # tests) inside the build cache; the cache itself is still needed so that
  # F Prime autocoded sources are built and analyzed
  - "**/CMakeFiles/**"
  # Third-party dependencies fetched by CMake (e.g. googletest via FetchContent)
  - "**/_deps/**"
  # Vendored third-party code is not maintained to the JPL standard
  - "Utils/Hash/libcrc/**"
  - "fprime-venv/**"
