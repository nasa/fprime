name: "CodeQL JPL Coding Standard - Recommendations 2 of 2"

disable-default-queries: true

packs:
  # Source of the query pack is https://github.com/github/codeql/tree/main/cpp/ql/src/JPL_C
  - codeql/cpp-queries:JPL_C

queries:
  # F Prime refinement of the Rule 17 basic-int-types query: it exempts the
  # plain `char` type when used as a C-string / character array (char*, char[])
  - uses: ./.github/codeql/fprime-queries

query-filters:
  # This will ONLY include the following query (the F Prime refinement of
  # cpp/jpl-c/basic-int-types, which whitelists plain-char C-strings/arrays)
  - include:
      id:
        - cpp/fprime/jpl-c/basic-int-types

paths-ignore:
  # CMake-internal generated sources (try_compile checks, compiler id, feature
  # tests) inside the build cache; the cache itself is still needed so that
  # F Prime autocoded sources are built and analyzed
  - "**/CMakeFiles/**"
  # Third-party dependencies fetched by CMake (e.g. googletest via FetchContent)
  - "**/_deps/**"
