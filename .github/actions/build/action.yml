name: "F´ Build"
description: "Generate and build an F´ deployment or module"
inputs:
  working-directory:
    description: "Directory to run fprime-util from"
    required: false
    default: "."
  cmake-args:
    description: "Extra flags passed to fprime-util generate (e.g. CMake defines)"
    required: false
    default: ""
  target-platform:
    description: "Target platform/toolchain passed to fprime-util (e.g. native, aarch64-linux)"
    required: false
    default: ""
  build-all:
    description: "Pass --all to fprime-util build to build all modules"
    required: false
    default: "false"
  jobs:
    description: "Parallel job count: a number, 'random' (1-32), or empty to omit -j"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: "Generate Build Cache"
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: fprime-util generate ${{ inputs.cmake-args }} ${{ inputs.target-platform }}
    - name: "Build"
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: |
        ALL_FLAG=""
        if [ "${{ inputs.build-all }}" = "true" ]; then
          ALL_FLAG="--all"
        fi
        JOBS_INPUT="${{ inputs.jobs }}"
        JOBS_FLAG=""
        if [ "${JOBS_INPUT}" = "random" ]; then
          JOBS=$(( (RANDOM % 32) + 1 ))
          JOBS_FLAG="-j${JOBS}"
          echo "Building with ${JOBS} parallel jobs (randomized 1-32)"
        elif [ -n "${JOBS_INPUT}" ]; then
          JOBS_FLAG="-j${JOBS_INPUT}"
          echo "Building with ${JOBS_INPUT} parallel jobs"
        else
          echo "Building with default parallelism"
        fi
        fprime-util build ${ALL_FLAG} ${JOBS_FLAG} ${{ inputs.target-platform }}
